<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIDI Piano Roll</title>
<link rel="stylesheet" href="./css/dawsome-pianoroll.css">
</head>
<body>
<div id="pianoroll">
  <div class="toolbar">
    <div class="group">
      <button id="playBtn" class="btn" title="Play / Stop (Space)">▶</button>
      <span id="posReadout" class="readout">1.1.1</span>
    </div>
    <div class="group">
      <label>BPM <input id="bpmInput" type="number" min="20" max="300" step="1" value="146"></label>
      <label>Bars <input id="barsInput" type="number" min="1" max="64" step="1" value="4"></label>
    </div>
    <div class="group">
      <label>Grid
        <select id="gridSelect">
          <optgroup label="Adaptive">
            <option value="widest">Widest</option>
            <option value="wide">Wide</option>
            <option value="medium" selected>Medium</option>
            <option value="narrow">Narrow</option>
            <option value="narrowest">Narrowest</option>
          </optgroup>
          <optgroup label="Fixed">
            <option value="1bar">1 Bar</option>
            <option value="1/2">1/2</option>
            <option value="1/4">1/4</option>
            <option value="1/8">1/8</option>
            <option value="1/16">1/16</option>
            <option value="1/32">1/32</option>
          </optgroup>
          <option value="off">Off</option>
        </select>
      </label>
      <button id="tripletBtn" class="btn" title="Triplet grid">Triplet</button>
      <button id="snapBtn" class="btn on" title="Snap to grid">Snap</button>
      <span id="gridReadout" class="readout">1/16</span>
    </div>
    <div class="group">
      <button id="drawBtn" class="btn on" title="Draw mode on: click adds/deletes. Off: select mode (B)">✎ Draw</button>
      <button id="followBtn" class="btn on" title="Scroll with the playhead">Follow</button>
      <button id="clearBtn" class="btn" title="Delete all notes">Clear</button>
    </div>
    <div class="group">
      <span class="readout" style="min-width: 0">Zoom</span>
      <button id="zoomOutH" class="btn" title="Zoom out (time)">H−</button>
      <button id="zoomInH" class="btn" title="Zoom in (time)">H+</button>
      <button id="zoomOutV" class="btn" title="Zoom out (pitch)">V−</button>
      <button id="zoomInV" class="btn" title="Zoom in (pitch)">V+</button>
    </div>
  </div>
  <div class="roll">
    <div class="corner"></div>
    <div id="rulerWrap"><canvas id="rulerCanvas"></canvas></div>
    <div id="keysWrap"><canvas id="keysCanvas"></canvas></div>
    <div id="gridWrap">
      <canvas id="gridCanvas"></canvas>
      <div id="scroller"><div id="spacer"></div></div>
    </div>
  </div>
  <div id="hint" class="hint"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script src="./js/pianoroll.js"></script>
<script>
const DEMO_NOTES = [
    [60, 0, 0.5], [64, 0.5, 0.5], [67, 1, 0.5], [72, 1.5, 0.5],
    [67, 2, 0.5], [64, 2.5, 0.5], [60, 3, 1],
    [48, 0, 2], [43, 2, 2],
  ];
function onNotesChanged(notes) {
  console.log("notes changed", notes)
}
createPianoroll(DEMO_NOTES, 146, onNotesChanged);
</script>
</body>
</html>
