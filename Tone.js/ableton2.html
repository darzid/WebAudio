let stopButton = document.getElementById("stop");
let recButton = document.getElementById("rec");

playButton.onclick = () => {
  if (playButton.classList.contains("active")) return;
  playButton.classList.add("active");
}

stopButton.onclick = () => {
  if (!playButton.classList.contains("active")) return;
  playButton.classList.remove("active");
  if (recButton.classList.contains("active")) {
    recButton.classList.remove("active");
  }
}

    for (sixteenth = 1; sixteenth <= 4; sixteenth++) {
      let className = (sixteenth > 1) ? "sixteenth" : (beat > 1) ? "beat" : "bar";
      let timelineElement = document.createElement("th");
      timelineElement.className = className;
      timelineElement.classList.add("position-column");
      
      timelineElement.innerText = `${bar}:${beat}:${sixteenth}`;
      timelineElement.title = `${bar}:${beat}:${sixteenth}`;
      tracksTableHeaderRow.appendChild(timelineElement);
    }
  }
}

let tracksTableBody = tracksTable.querySelector("tbody");

tracks.forEach(track => {
  let trackIndex = tracks.indexOf(track);
  
  let trackRow = document.createElement("tr");
  trackRow.id = track.name + "-row";
  trackRow.className = "track-row";
  tracksTableBody.appendChild(trackRow);
  
  let trackHeaderColumn = document.createElement("td");
  trackHeaderColumn.classList.add("track-header");
  trackHeaderColumn.classList.add("control");
  trackRow.appendChild(trackHeaderColumn);
  
  let trackHeaderDiv = document.createElement("div");
  trackHeaderColumn.appendChild(trackHeaderDiv);
  
  trackHeaderDiv.innerHTML = `<button class="control toggle-button enabled-button active"></button>
              <label><input name="track-name" class="control medium-width" type="text" value="${track.name}" readonly></label>`;
  
  let clipIndex = 1;
  for (bar = 1; bar <= 4; bar++) {
    for (beat = 1; beat <= 4; beat++) {
      for (sixteenth = 1; sixteenth <= 4; sixteenth++) {
        let columnElement = document.createElement("td");
        columnElement.className = "clip-column";
        if (beat % 2 == 0) 
          columnElement.classList.add("banded");
        trackRow.appendChild(columnElement);
        
        let clipPosition = `${bar}:${beat}:${sixteenth}`;
        
        let clip = track.clips.find(clip => clip.position.startsWith(clipPosition));
        if (clip) {
          
          
          let clipElement = document.createElement("div");
          clipElement.id = `${track.name}-Clip${clipIndex}`;
          clipElement.className = "Clip";
          clipElement.innerText = clip.name;
          
          let clipDurationInSixteenths = getSixteenths(clip.duration);
          
          clipElement.style.width = `${clipDurationInSixteenths * 100}%`;
          
          columnElement.appendChild(clipElement);
          
          if (clip.position.indexOf(".")) {
            let clipOffset = parseFloat(`0.${clip.position.split(".")[1]}`);
            clipElement.classList.add("clip-with-offset");
            clipElement.dataset.offset = clipOffset;
            
            applyClipOffset(clipElement);
            //let columnWidth = clipElement.parentElement.getBoundingClientRect().width;
            //clipElement.style.marginLeft = `${columnWidth * clipOffset}px`;
            //console.log(clipElement.style.marginLeft, columnWidth);
          }
          
          clipIndex++;
        }
      }
    }
  }
});

function getSixteenths(time) {
  let parts = time.split(":");
  let bars = parseInt(parts[0]);
  let beats = (bars * 4) + parseInt(parts[1]);
  let sixteenths = (beats * 4) + parseFloat(parts[2]);
  return sixteenths;
}

function applyClipOffset(clipElement) {
  let columnWidth = clipElement.parentElement.getBoundingClientRect().width;
  clipElement.style.marginLeft = `${columnWidth * clipElement.dataset.offset}px`;
  console.log(clipElement.style.marginLeft, columnWidth);
}

let trackNameElements = document.querySelectorAll("input[name='track-name']");
trackNameElements.forEach(element => {
  element.ondblclick = () => element.readOnly ? element.readOnly = "" : element.readOnly = "true";
  element.onblur = () =>  element.readOnly = "true";
});


let selectedTrackRow = null;
let trackRowHeaders = tracksTable.querySelectorAll("tr.track-row td div");
trackRowHeaders.forEach(header => header.onclick = () => {
  
  let trackRow = header.closest("tr");
  if (selectedTrackRow)
    selectedTrackRow.classList.remove("selected");
  trackRow.classList.add("selected");
  selectedTrackRow = trackRow;
  showTrackDevices(trackRow.id.split("-row")[0]);
});

let devicesPanelHeader = document.querySelector("#track-devices-panel .panel-header");
let devicesPanelContent = document.querySelector("#track-devices-panel .panel-content");


function showTrackDevices(trackId) {
  let track = tracks.find(track => track.name == trackId);
  console.log(trackId, track.devices);
  devicesPanelHeader.innerText = `Devices - ${trackId}`;
  devicesPanelContent.innerHTML = "";
  
  let deviceIndex = 1;
  track.devices.forEach(device => {
    let deviceElement = document.createElement("div");
    deviceElement.className = "device panel";
    deviceElement.id = `${trackId}-Device${deviceIndex}`;
    devicesPanelContent.appendChild(deviceElement);
    
    let deviceHeaderElement = document.createElement("div");
    deviceHeaderElement.className = "panel-header";
    deviceHeaderElement.innerHTML = `<button class="control toggle-button enabled-button active"></button>${device.name}`;
    deviceElement.appendChild(deviceHeaderElement);
    
    let deviceContentElement = document.createElement("div");
    deviceContentElement.className = "panel-content";
    deviceElement.appendChild(deviceContentElement);
    
    Object.keys(device.parameters).forEach(parameterName => {
      let parameterLabelElement = document.createElement("label");
      parameterLabelElement.className = "number-label";
      parameterLabelElement.innerHTML = `${parameterName}<input class="control" type="number" min="0" max="127" value="${device.parameters[parameterName]}">`;
      deviceContentElement.appendChild(parameterLabelElement);
    })
    initializeNumberInputs(deviceElement);
    initializeToggleButtons(deviceElement);
    deviceIndex++;
  })
  
}
let zoomElement = document.getElementById("zoom");
let positionColumns = tracksTable.querySelectorAll(".position-column");
let clipColumns = tracksTable.querySelectorAll(".clip-column");
let clipsWithOffset = tracksTable.querySelectorAll(".clip-with-offset");

let zoomFactor = zoomElement.value / 100;
let tableHead = tracksTable.querySelector("thead");
var style = window.getComputedStyle(tableHead, null).getPropertyValue('font-size');
tableHead.dataset.fontSize = parseFloat(style); 
clipColumns.forEach(column => {
  column.dataset.width = column.getBoundingClientRect().width;
});
positionColumns.forEach(column => {
  column.dataset.width = column.getBoundingClientRect().width;
});

zoomElement.oninput = () => {
  let zoomFactor = zoomElement.value / 100;
  //tableHead.style.fontSize = (tableHead.dataset.fontSize * zoomFactor) + "px";
  clipColumns.forEach(column => {
    column.style.maxWidth = (column.dataset.width * zoomFactor) + "px";
    column.style.minWidth = (column.dataset.width * zoomFactor) + "px";
  });
  clipsWithOffset.forEach(clip => {
    applyClipOffset(clip);
  })
  positionColumns.forEach(column => {
    column.style.maxWidth = (column.dataset.width * zoomFactor) + "px";
    column.style.minWidth = (column.dataset.width * zoomFactor) + "px";
  });
};

initializeNumberInputs(document);

function initializeToggleButtons(parentElement) {
  parentElement.querySelectorAll(".toggle-button")
  .forEach((button) => button.addEventListener("click", () => button.classList.toggle("active")));
}
initializeToggleButtons(document);
