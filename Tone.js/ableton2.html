<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="css/ableton.css">
  <script src="./js/Number.js"></script>
  <script src="./js/ui-components/number-input.js"></script>
  <script src="./js/ui-components/table.js"></script>
  <script src="./js/ui-components/table-zoom.js"></script>
  <script src="./data/tracks.js"></script>
  <script src="./js/tracks-table.js"></script>
  <style>

  </style>
</head>

<body>
  <div id="app">
    <div id="project-header" class="margins">
      <button class="control image-button"><img src="img/upload-black.png"></button>
      <input id="project-name" class="control" type="text" value="My project">
      <button class="control image-button margin-right"><img src="img/download-black.png"></button>
    </div>
    <div id="app-buttons">
      <input id="tempo" class="control" type="number" value="120">
      
      <button id="play" class="control image-button transport-button margin-left"><img src="img/play-black.png"></button>
      <button id="stop" class="control image-button transport-button"><img src="img/stop-black.png"></button>
      <button id="rec" class="control image-button transport-button toggle-button"><img src="img/rec-black.png"></button>
      
      <input id="position" class="control time margin-left" type="text" value="1:1:1" readonly>

      <input id="project-length" class="control time margin-left" type="text" value="8:0:0">
      <button class="control image-button toggle-button active"><img src="img/loop.png"></button>
      
      <button class="control image-button toggle-button active margin-left"><img src="img/clip.png"></button>
      <button class="control image-button toggle-button active "><img src="img/audio-device.png"></button>
      <button class="control image-button toggle-button"><img src="img/mixer.png"></button>
    </div>
    <div class="zoom-label">
      <label class="range-label small">Zoom
        <input id="zoom" type="range" min="50" max="200" value="100">
      </label>
    </div>

    <div id="tracks-table-container" class="table-container">
      <table id="tracks-table">
        <thead>
          <tr class="header-row">
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
    </div>
  </div>
  <div id="track-devices-panel" class="panel">
    <div class="panel-header">
      Devices
    </div>
    <div class="panel-content">
    </div>
  </div>
  <script>
let playButton = document.getElementById("play");
let stopButton = document.getElementById("stop");
let recButton = document.getElementById("rec");

playButton.onclick = () => {
  if (playButton.classList.contains("active")) return;
  playButton.classList.add("active");
}

stopButton.onclick = () => {
  if (!playButton.classList.contains("active")) return;
  playButton.classList.remove("active");
  if (recButton.classList.contains("active")) {
    recButton.classList.remove("active");
  }
}

let tracksTable = document.getElementById("tracks-table");
fillTracksTable(tracksTable, tracks);

let selectedTrackRow = null;
  let trackRowHeaders = tracksTable.querySelectorAll("tr.track-row td div");
  trackRowHeaders.forEach(header => header.onclick = () => {
    
    let trackRow = header.closest("tr");
    if (selectedTrackRow)
      selectedTrackRow.classList.remove("selected");
    trackRow.classList.add("selected");
    selectedTrackRow = trackRow;
    showTrackDevices(trackRow.id.split("-row")[0]);
  });
  
let devicesPanelHeader = document.querySelector("#track-devices-panel .panel-header");
let devicesPanelContent = document.querySelector("#track-devices-panel .panel-content");

function showTrackDevices(trackId) {
  let track = tracks.find(track => track.name == trackId);
  console.log(trackId, track.devices);
  devicesPanelHeader.innerText = `Devices - ${trackId}`;
  devicesPanelContent.innerHTML = "";
  
  let deviceIndex = 1;
  track.devices.forEach(device => {
    let deviceElement = document.createElement("div");
    deviceElement.className = "device panel";
    deviceElement.id = `${trackId}-Device${deviceIndex}`;
    devicesPanelContent.appendChild(deviceElement);
    
    let deviceHeaderElement = document.createElement("div");
    deviceHeaderElement.className = "panel-header";
    deviceHeaderElement.innerHTML = `<button class="control toggle-button enabled-button active"></button>${device.name}`;
    deviceElement.appendChild(deviceHeaderElement);
    
    let deviceContentElement = document.createElement("div");
    deviceContentElement.className = "panel-content";
    deviceElement.appendChild(deviceContentElement);
    
    Object.keys(device.parameters).forEach(parameterName => {
      let parameterLabelElement = document.createElement("label");
      parameterLabelElement.className = "number-label";
      parameterLabelElement.innerHTML = `${parameterName}<input class="control" type="number" min="0" max="127" value="${device.parameters[parameterName]}">`;
      deviceContentElement.appendChild(parameterLabelElement);
    })
    initializeNumberInputs(deviceElement);
    initializeToggleButtons(deviceElement);
    deviceIndex++;
  })
}

function initializeToggleButtons(parentElement) {
  parentElement.querySelectorAll(".toggle-button")
  .forEach((button) => button.addEventListener("click", () => button.classList.toggle("active")));
}

initializeNumberInputs(document);
initializeToggleButtons(document);
initializeTableZoom(tracksTable, document.getElementById("zoom"));
  </script>

</body>

</html>
