  <div id="app">
    <div id="project-header" class="margins">
      <button class="control image-button"><img src="img/upload-black.png"></button>
      <input id="project-name" class="control" type="text" value="My project">
      <button class="control image-button margin-right"><img src="img/download-black.png"></button>
    </div>
    <div id="app-buttons">
      <input id="tempo" class="control" type="number" value="120">
      
      <button id="play" class="control image-button transport-button margin-left"><img src="img/play-black.png"></button>
      <button id="stop" class="control image-button transport-button"><img src="img/stop-black.png"></button>
      <button id="rec" class="control image-button transport-button toggle-button"><img src="img/rec-black.png"></button>
      
      <input id="position" class="control time margin-left" type="text" value="1:1:1" readonly>

      <input id="project-length" class="control time margin-left" type="text" value="8:0:0">
      <button class="control image-button toggle-button active"><img src="img/loop.png"></button>
      
      <button class="control image-button toggle-button active margin-left"><img src="img/clip.png"></button>
      <button class="control image-button toggle-button active "><img src="img/audio-device.png"></button>
      <button class="control image-button toggle-button"><img src="img/mixer.png"></button>
    </div>

        <input class="control" type="number" min="0" max="1" step="0.01" value="0.2">
      </label>
    </div>
    -->
    <div class="zoom-label">
      <label class="range-label">Zoom
        <input id="zoom" type="range" min="50" max="200" value="100">
      </label>
    </div>

    <div id="tracks-table-container" class="table-container">
      <table id="tracks-table">
        <thead>

    </div>

initializeNumberInputs();

let playButton = document.getElementById("play");
let stopButton = document.getElementById("stop");
let recButton = document.getElementById("rec");

playButton.onclick = () => {
  if (playButton.classList.contains("active")) return;
  playButton.classList.add("active");
}

stopButton.onclick = () => {
  if (!playButton.classList.contains("active")) return;
  playButton.classList.remove("active");
  if (recButton.classList.contains("active")) {
    recButton.classList.remove("active");
  }
}



let tracksTable = document.getElementById("tracks-table");
let tracksTableHeaderRow = tracksTable.querySelector(".header-row");
let leftTopHeader = document.createElement("th");
leftTopHeader.innerText = "";

tracksTableHeaderRow.appendChild(leftTopHeader);

for (bar = 1; bar <= 4; bar++) {
  for (beat = 1; beat <= 4; beat++) {
    for (sixteenth = 1; sixteenth <= 4; sixteenth++) {
      let className = (sixteenth > 1) ? "sixteenth" : (beat > 1) ? "beat" : "bar";
      let timelineElement = document.createElement("th");
      timelineElement.className = className;
      timelineElement.classList.add("position-column");
      
      timelineElement.innerText = `${bar}:${beat}:${sixteenth}`;
      timelineElement.title = `${bar}:${beat}:${sixteenth}`;
      tracksTableHeaderRow.appendChild(timelineElement);
    }
  }
}

let tracksTableBody = tracksTable.querySelector("tbody");

tracks.forEach(track => {
  let trackIndex = tracks.indexOf(track);
  
  let trackRow = document.createElement("tr");
  trackRow.id = track.name + "-row";
  trackRow.className = "track-row";
  tracksTableBody.appendChild(trackRow);
  
  let trackHeaderColumn = document.createElement("td");
  trackHeaderColumn.classList.add("track-header");
  trackHeaderColumn.classList.add("control");
  trackRow.appendChild(trackHeaderColumn);
  
  let trackHeaderDiv = document.createElement("div");
  trackHeaderColumn.appendChild(trackHeaderDiv);
  
  trackHeaderDiv.innerHTML = `<button class="control toggle-button enabled-button active"></button>
              <label><input name="track-name" class="control medium-width" type="text" value="${track.name}" readonly></label>`;
  
  let clipIndex = 1;
  for (bar = 1; bar <= 4; bar++) {
    for (beat = 1; beat <= 4; beat++) {
      for (sixteenth = 1; sixteenth <= 4; sixteenth++) {
        let columnElement = document.createElement("td");
        columnElement.className = "clip-column";
        
        trackRow.appendChild(columnElement);
        
        let clipPosition = `${bar}:${beat}:${sixteenth}`;
        
        let clip = track.clips.find(clip => clip.position.startsWith(clipPosition));
        if (clip) {
          let clipElement = document.createElement("div");
          clipElement.id = `${track.name}-Clip${clipIndex}`;
          clipElement.className = "Clip";
          clipElement.innerText = clip.name;
          columnElement.appendChild(clipElement);
          clipIndex++;
        }
      }
    }
  }
});

let trackNameElements = document.querySelectorAll("input[name='track-name']");
trackNameElements.forEach(element => {
  element.ondblclick = () => element.readOnly ? element.readOnly = "" : element.readOnly = "true";
  element.onblur = () =>  element.readOnly = "true";
});


let selectedTrackRow = null;
let trackRowHeaders = tracksTable.querySelectorAll("tr.track-row td div");
trackRowHeaders.forEach(header => header.onclick = () => {
  let trackRow = header.closest("tr");
  if (selectedTrackRow)
    selectedTrackRow.classList.remove("selected");
  trackRow.classList.add("selected");
  selectedTrackRow = trackRow;
});


let zoomElement = document.getElementById("zoom");
let positionColumns = tracksTable.querySelectorAll(".position-column");
let clipColumns = tracksTable.querySelectorAll(".clip-column");

let zoomFactor = zoomElement.value / 100;

clipColumns.forEach(column => {
  column.dataset.width = column.getBoundingClientRect().width;
});
positionColumns.forEach(column => {
  column.dataset.width = column.getBoundingClientRect().width;
});

zoomElement.oninput = () => {
  let zoomFactor = zoomElement.value / 100;
  clipColumns.forEach(column => {
    column.style.maxWidth = (column.dataset.width * zoomFactor) + "px";
    column.style.minWidth = (column.dataset.width * zoomFactor) + "px";
  });
  positionColumns.forEach(column => {
    column.style.maxWidth = (column.dataset.width * zoomFactor) + "px";
    column.style.minWidth = (column.dataset.width * zoomFactor) + "px";
  });
};
