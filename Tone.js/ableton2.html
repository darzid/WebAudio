<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="css/ableton.css">
  <script src=".\js\Number.js"></script>
  <script src=".\js\ui-components\number-input.js"></script>
  <style>

  </style>
</head>

<body>
  <div id="app">
    <div id="project-header" class="margins">
      <button class="control image-button"><img src="img/upload-black.png"></button>
      <input id="project-name" class="control" type="text" value="My project">
      <button class="control image-button margin-right"><img src="img/download-black.png"></button>
    </div>
    <div id="app-buttons">
      <input id="tempo" class="control" type="number" value="120">
      
      <button id="play" class="control image-button transport-button margin-left"><img src="img/play-black.png"></button>
      <button id="stop" class="control image-button transport-button"><img src="img/stop-black.png"></button>
      <button id="rec" class="control image-button transport-button toggle-button"><img src="img/rec-black.png"></button>
      
      <input id="position" class="control time margin-left" type="text" value="1:1:1" readonly>

      <input id="project-length" class="control time margin-left" type="text" value="8:0:0">
      <button class="control image-button toggle-button active"><img src="img/loop.png"></button>
      
      <button class="control image-button toggle-button active margin-left"><img src="img/clip.png"></button>
      <button class="control image-button toggle-button active "><img src="img/audio-device.png"></button>
      <button class="control image-button toggle-button"><img src="img/mixer.png"></button>
    </div>
    
    <div class="panel">
      <label class="number-label">Velocity
        <input class="control" type="number" min="0" max="127" value="20">
      </label>
      <label class="number-label">Q
        <input class="control" type="number" min="0" max="1" step="0.01" value="0.2">
      </label>
    </div>
    
    <div id="tracks-table-container">
      <table id="tracks-table">
        <tr>
          <th class="headcol top-row"></th>
          <td id="timeline" class="timeline-col">        
          </td>
        </tr>
        
        <tr class="track-row">
          <th class="headcol">
            <div>
              <button class="control toggle-button enabled-button"></button>
              <label><input name="track-name" class="control medium-width" type="text" value="Track 1"></label>
            </div>       
          </th>
          <td id="Track1-Clips">        
          </td>
        </tr>
        <tr class="track-row">
          <th class="headcol">
            <div>
              <button class="control toggle-button enabled-button"></button>
              <label><input name="track-name" class="control medium-width" type="text" value="Track 2"></label>
            </div>
          </th>
          <td id="Track2-Clips">
          </td>
        </tr>
      </table>
    </div>
  
  </div>
  <script>

document.querySelectorAll(".toggle-button").forEach((button) => button.addEventListener("click", () => button.classList.toggle("active")));
initializeNumberInputs();

let playButton = document.getElementById("play");
let stopButton = document.getElementById("stop");
let recButton = document.getElementById("rec");

playButton.onclick = () => {
  if (playButton.classList.contains("active")) return;
  playButton.classList.add("active");
}

stopButton.onclick = () => {
  if (!playButton.classList.contains("active")) return;
  playButton.classList.remove("active");
  if (recButton.classList.contains("active")) {
    recButton.classList.remove("active");
  }
}

let positions = {};

let timeline = document.getElementById("timeline");
let bar = 1;
let beat = 1;
for (bar = 1; bar <= 4; bar++) {
  for (beat = 1; beat <= 4; beat++) {
    for (sixteenth = 1; sixteenth <= 4; sixteenth++) {
      let className = (sixteenth > 1) ? "sixteenth" : (beat > 1) ? "beat" : "bar";
      let timelineElement = document.createElement("div");
      timelineElement.className = className;
      timelineElement.innerText = `${bar}:${beat}:${sixteenth}`;
      timelineElement.title = `${bar}:${beat}:${sixteenth}`;
      timeline.appendChild(timelineElement);
    }
  }
}

let trackClips = {
  "Track1": {
    "1:1:1": "Kick",
    "1:2:1": "Kick",
    "1:3:1": "Kick",
    "1:4:1": "Kick",
    "2:1:1": "Kick",
    "2:2:1": "Kick",
    "2:3:1": "Kick",
    "2:4:1": "Kick"
  },
  "Track2": {
    "1:1:2": "Bass01",
    "1:1:3": "Bass02",
    "1:1:4": "Bass03",
    "1:2:2": "Bass01",
    "1:2:3": "Bass02",
    "1:2:4": "Bass03",
    "1:3:2": "Bass01",
    "1:3:3": "Bass02",
    "1:3:4": "Bass03",
    "1:4:2": "Bass01",
    "1:4:3": "Bass02",
    "1:4:4": "Bass03",
    "2:1:2": "Bass01",
    "2:1:3": "Bass02",
    "2:1:4": "Bass03",
    "2:2:2": "Bass01",
    "2:2:3": "Bass02",
    "2:2:4": "Bass03",
    "2:3:2": "Bass01",
    "2:3:3": "Bass02",
    "2:3:4": "Bass03",
    "2:4:2": "Bass01",
    "2:4:3": "Bass02",
    "2:4:4": "Bass03"
  },
};

let firstTimelineElement = timeline.querySelector(`div[title='1:1:1']`);
let firstTimelineElementRect = firstTimelineElement.getBoundingClientRect();
let secondTimelineElement = timeline.querySelector(`div[title='1:1:2']`);
let secondTimelineElementRect = secondTimelineElement.getBoundingClientRect();

let timelineLeft = firstTimelineElementRect.left;
let timelineElementWidth =firstTimelineElementRect.width - 1;

let tracksTable = document.getElementById("tracks-table");
Object.keys(trackClips).forEach(track => {
/*  let trackRowHtml = `<tr>
          <th class="headcol">
            <div>
              <button class="control toggle-button enabled-button"></button>
              <label><input name="track-name" class="control medium-width" type="text" value="${track}"></label>
            </div>
          </th>
          <td id="${track}-Clips">
          </td>
        </tr>`;
  tracksTable.innerHTML += trackRowHtml;*/
  let trackClipsElement = document.getElementById(track + "-Clips");
  
  Object.keys(trackClips[track]).forEach(clipPosition => {
    let clipElement = document.createElement("div");
    clipElement.className = "Clip";
    clipElement.innerText = trackClips[track][clipPosition];
    clipElement.title = clipPosition;
    clipElement.style.width = timelineElementWidth + "px";
    
    let timelineElement = timeline.querySelector(`div[title='${clipPosition}']`);
    let timelineElementLeft = timelineElement.getBoundingClientRect().left - timelineLeft;
    
    let previousClip = trackClipsElement.lastChild;
    let previousClipTimelineElement = previousClip ? timeline.querySelector(`div[title='${previousClip.title}']`) : null;
    let previousClipTimelineElementRight = previousClipTimelineElement ? previousClipTimelineElement.getBoundingClientRect().right - timelineLeft : 0;
    let clipLeft = timelineElementLeft - previousClipTimelineElementRight;
    
    clipElement.style.marginLeft = `${clipLeft - 1}px`;
    //console.log(track + "-" + clipElement.innerText, timelineElement.title, timelineElement.getBoundingClientRect().left - timelineLeft);
    trackClipsElement.appendChild(clipElement);
  })
});

  </script>
</body>

</html>
