<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="css/ableton.css">
  <link rel="stylesheet" href="css/tabs.css">
  <script src="./js/Number.js"></script>
  <script src="./js/ui-components/number-input.js"></script>
  <script src="./js/ui-components/table.js"></script>
  <script src="./js/ui-components/table-zoom.js"></script>
  <script src="./js/ui-components/tabs.js"></script>
  <script src="./data/tracks.js"></script>
  <script src="./js/tracks-table.js"></script>
  <script src="./js/device-panel.js"></script>
  <script src="https://g200kg.github.io/webaudio-pianoroll/webaudio-pianoroll.js"></script>
  <script src="./ableton2.js"></script>
</head>

<body>
  <div id="app">
    <div id="project-header" class="margins">
      <button class="control image-button"><img src="img/upload-black.png"></button>
      <input id="project-name" class="control" type="text" value="My project">
      <button class="control image-button margin-right"><img src="img/download-black.png"></button>
    </div>
    <div id="app-buttons">
      <input id="tempo" class="control" type="number" value="120">
      
      <button id="play" class="control image-button transport-button margin-left"><img src="img/play-black.png"></button>
      <button id="stop" class="control image-button transport-button"><img src="img/stop-black.png"></button>
      <button id="rec" class="control image-button transport-button toggle-button"><img src="img/rec-black.png"></button>
      
      <input id="position" class="control time margin-left" type="text" value="1:1:1" readonly>

      <input id="project-length" class="control time margin-left" type="text" value="8:0:0">
      <button class="control image-button toggle-button active"><img src="img/loop.png"></button>
      
      <button id="toggle-devices" class="control image-button toggle-button active margin-left"><img src="img/audio-device.png"></button>
      <button id="toggle-clipview" class="control image-button toggle-button"><img src="img/clip.png"></button>
      <button id="toggle-mixer" class="control image-button toggle-button"><img src="img/mixer.png"></button>
    </div>
    <div class="zoom-label">
      <label class="range-label small">Zoom
        <input id="zoom" type="range" min="50" max="200" value="100">
      </label>
    </div>

    <div id="tracks-table-container" class="table-container">
      <table id="tracks-table">
        <thead>
          <tr class="header-row">
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
    </div>
  </div>
  <div id="track-devices-panel" class="devices-panel">
    <div class="panel-header">
      Devices
    </div>
    <div class="scroll">
      <div class="panel-content"></div>
    </div>
  </div>
  <div id="clip-editor-panel" class="clip-editor-panel">
    <div class="panel-header">
      Edit clip
    </div>
    <div class="scroll panel-content">
      <input type="range" id="pianoroll-scroll-x" oninput="pianorollScrollX()" value=0>
      <div style="display: flex; flex-direction: row">
        <input type="range" id="pianoroll-scroll-y" oninput="pianorollScrollY()" value=0>
        <webaudio-pianoroll id="piano-roll" width="345" height="300"></webaudio-pianoroll>
        <input type="range" id="pianoroll-zoom-y" oninput="pianorollZoomY()" value=16 min=1 max=64>
      </div>
      <input type="range" id="pianoroll-zoom-x" oninput="pianorollZoomX()" value=16 min=1 max=64> 
      </div>
    
  </div>
  <script>
initialize();
  </script>

</body>

</html>
