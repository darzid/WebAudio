<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="css/dawsome-main.css">
  <link rel="stylesheet" href="css/dawsome-button-bar.css">
  <link rel="stylesheet" href="css/dawsome-project-header.css">
  <link rel="stylesheet" href="css/dawsome-transport-bar.css">
  <link rel="stylesheet" href="css/dawsome-tracks-table.css">
  <link rel="stylesheet" href="css/dawsome-bottom-panels.css">
  <link rel="stylesheet" href="css/dawsome-device-panel.css">
  <link rel="stylesheet" href="css/dawsome-clip-editor-panel.css">
  
  <script src="https://unpkg.com/tone"></script>
  <script src="..\lib\template-expander\template-expander.js"></script>
  <script src="./js/Number.js"></script>
  <script src="./js/ui-components/number-input.js"></script>
  <script src="./js/ui-components/table.js"></script>
  <script src="./js/ui-components/table-zoom.js"></script>
  <script src="./js/ui-components/tabs.js"></script>
<!--  <script src="./data/tracks.js"></script>-->
  <script src="./js/tracks-table.js"></script>
  <script src="./js/bottom-panel.js"></script>
  <script src="./js/device-panel.js"></script>
  <script src="./js/clip-editor-panel.js"></script>
  
  <script src=".\js\recorder.js" type="module"></script>
  <script src=".\js\preset-browser.js"></script>
  <script src=".\js\device-browser.js"></script>
  <script src=".\js\project.js"></script>
  <script src=".\js\bind.js"></script>
  <script src=".\js\tone-helper.js"></script>
  <script src=".\js\transport.js"></script>
  <script src=".\js\file-io.js"></script>
  <script src=".\js\user-interface3.js"></script>
    
  <script src="https://cdn.jsdelivr.net/gh/darzid/html-components@main/number-input/number-input.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/darzid/html-components@main/tab-control/tab-control.js"></script>
  <script src="https://g200kg.github.io/webaudio-pianoroll/webaudio-pianoroll.js"></script>
  
  <script src="./index3.js"></script>
</head>

<body>
  <span id="templates">

      <template id="RangeParameter">
        <article class="Parameter">
          <label for="${item.id}">${item.name}</label>
          <input id="${item.id}" name="${item.name}" type="range" min="${item.min}" max="${item.max}" step="${item.step}" value="${item.value}">
          <value for="${item.id}">${item.value}</value>
        </article>
      </template>

      <span id="datatype-templates">
        <template id="NormalRange">
          <div data-template="RangeParameter" name="${item.name}" min="0" max="1" step="0.01" value="${item.value}" />
        </template>

        <template id="Positive">
          <div data-template="RangeParameter" name="${item.name}" min="0" max="Infinity" step="0.01" value="${item.value}" />
        </template>

        <template id="AudioRange">
          <div data-template="RangeParameter" name="${item.name}" min="-1" max="1" step="0.01" value="${item.value}" />
        </template>

        <template id="Decibels">
          <div data-template="RangeParameter" name="${item.name}" min="-40" max="0" step="0.01" value="${item.value}" />
        </template>

        <template id="Cents">
          <div data-template="RangeParameter" name="${item.name}" min="-1200" max="1200" step="0.01" value="${item.value}" />
        </template>

        <template id="Frequency">
          <div data-template="RangeParameter" name="${item.name}" min="0" max="22500" step="0.01" value="${item.value}" />
        </template>

        <template id="Time">
          <div data-template="RangeParameter" name="${item.name}" min="0" max="Infinity" step="0.01" value="${item.value}" />
        </template>

        <template id="TransportTime">
          <div data-template="RangeParameter" name="${item.name}" min="0" max="Infinity" step="0.01" value="${item.value}" />
        </template>

        <template id="Ticks">
          <div data-template="RangeParameter" name="${item.name}" min="0" max="Infinity" step="0.01" value="${item.value}" />
        </template>

        <template id="Degrees">
          <div data-template="RangeParameter" name="${item.name}" min="0" max="360" step="0.01" value="${item.value}" />
        </template>

        <template id="Radians">
          <div data-template="RangeParameter" name="${item.name}" min="0" max="6.28318530717959" step="0.01" value="${item.value}" />
        </template>

        <template id="Gain">
          <div data-template="RangeParameter" name="${item.name}" min="0" max="1" step="0.01" value="${item.value}" />
        </template>

        <template id="Volume">
          <div data-template="RangeParameter" name="${item.name}" min="-60" max="0" step="0.01" value="${item.value}" />
        </template>

        <template id="Pan">
          <div data-template="RangeParameter" name="${item.name}" min="-1" max="1" step="0.01" value="${item.value}" />
        </template>

        <template id="ModulationRange">
          <div data-template="RangeParameter" name="${item.name}" min="-1000" max="1000" step="0.01" value="${item.value}" />
        </template>

        <template id="TrackVolume">
          <div data-template="RangeParameter" name="${item.name}" min="-60" max="0" step="0.01" value="${item.value}" />
        </template>

        <template id="TrackPan">
          <div data-template="RangeParameter" name="${item.name}" min="-1" max="1" step="0.01" value="${item.value}" />
        </template>

        <template id="amplitude">
          <div data-template="RangeParameter" name="${item.name}" min="0" max="1" step="0.01" value="${item.value}" />
        </template>

        <template id="octaves">
          <div data-template="RangeParameter" name="${item.name}" min="0" max="8" step="1" value="${item.value}" />
        </template>

        <template id="resonance">
          <div data-template="RangeParameter" name="${item.name}" min="0" max="7000" step="0.01" value="${item.value}" />
        </template>

        <template id="outputRange">
          <div data-template="RangeParameter" name="${item.name}" min="any" max="any" step="0.01" value="${item.value}" />
        </template>

        <template id="adr">
          <div data-template="RangeParameter" name="${item.name}" min="0" max="2" step="0.001" value="${item.value}" />
        </template>

        <template id="detune">
          <div data-template="RangeParameter" name="${item.name}" min="-1200" max="1200" step="0.01" value="${item.value}" />
        </template>

        <template id="phase">
          <div data-template="RangeParameter" name="${item.name}" min="0" max="360" step="0.01" value="${item.value}" />
        </template>

        <template id="partialCount">
          <div data-template="RangeParameter" name="${item.name}" min="0" max="32" step="1" value="${item.value}" />
        </template>

        <template id="Q">
          <div data-template="RangeParameter" name="${item.name}" min="-20" max="20" step="0.01" value="${item.value}" />
        </template>

        <template id="FilterDetune">
          <div data-template="RangeParameter" name="${item.name}" min="-2400" max="2400" step="0.1" value="${item.value}" />
        </template>

        <template id="FilterGain">
          <div data-template="RangeParameter" name="${item.name}" min="-60" max="60" step="0.01" value="${item.value}" />
        </template>

        <template id="knee">
          <div data-template="RangeParameter" name="${item.name}" min="0" max="40" step="0.1" value="${item.value}" />
        </template>

        <template id="ratio">
          <div data-template="RangeParameter" name="${item.name}" min="1" max="20" step="0.01" value="${item.value}" />
        </template>

        <template id="attackNoise">
          <div data-template="RangeParameter" name="${item.name}" min="0.1" max="20" step="0.01" value="${item.value}" />
        </template>

        <template id="maxPolyphony">
          <div data-template="RangeParameter" name="${item.name}" min="1" max="20" step="1" value="${item.value}" />
        </template>

      </span>

      <span id="optionvalue-templates">
        <template id="OscillatorType">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <select name="${item.name}" value="${item.value}">
              <option>sine</option>
              <option>square</option>
              <option>triangle</option>
              <option>sawtooth</option>
              <option>pulse</option>
              <option>pwm</option>
              <option>fatsine</option>
              <option>fatsquare</option>
              <option>fattriangle</option>
              <option>fatsawtooth</option>
              <option>amsine</option>
              <option>amsquare</option>
              <option>amtriangle</option>
              <option>amsawtooth</option>
              <option>fmsine</option>
              <option>fmsquare</option>
              <option>fmtriangle</option>
              <option>fmsawtooth</option>
            </select>
          </article>
        </template>

        <template id="EnvelopeCurve">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <select name="${item.name}" value="${item.value}">
              <option>linear</option>
              <option>exponential</option>
              <option>sine</option>
              <option>cosine</option>
              <option>bounce</option>
              <option>ripple</option>
              <option>step</option>
            </select>
          </article>
        </template>

        <template id="Rolloff">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <select name="${item.name}" value="${item.value}">
              <option>-12</option>
              <option>-24</option>
              <option>-48</option>
              <option>-96</option>
            </select>
          </article>
        </template>

        <template id="FilterType">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <select name="${item.name}" value="${item.value}">
              <option>lowpass</option>
              <option>highpass</option>
              <option>bandpass</option>
              <option>lowshelf</option>
              <option>highshelf</option>
              <option>peaking</option>
              <option>notch</option>
              <option>allpass</option>
            </select>
          </article>
        </template>

        <template id="OversampleType">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <select name="${item.name}" value="${item.value}">
              <option>none</option>
              <option>2x</option>
              <option>4x</option>
            </select>
          </article>
        </template>

        <template id="NoiseType">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <select name="${item.name}" value="${item.value}">
              <option>pink</option>
              <option>white</option>
              <option>brown</option>
            </select>
          </article>
        </template>

      </span>

      <span id="component-templates">

        <template id="EnvelopeBase">
          <span>
            <div name="attack" data-template="adr" value="0.1"></div>
            <div name="attackCurve" data-template="EnvelopeCurve" value="exponential"></div>
            <div name="decay" data-template="adr" value="0.2"></div>
            <div name="decayCurve" data-template="EnvelopeCurve" value="exponential"></div>
            <div name="sustain" data-template="NormalRange" value="1.0"></div>
            <div name="release" data-template="adr" value="0.8"></div>
            <div name="releaseCurve" data-template="EnvelopeCurve" value="exponential"></div>
          </span>
        </template>

        <template id="AmplitudeEnvelope">
          <article name="${item.name}" class="Component Module">
            <div class="title-bar"><button class="toggle-button">${item.name}</button></div>
            <div class="expander-content ModuleParameters" name="${item.name}" data-template="EnvelopeBase"></div>
          </article>
        </template>

        <template id="ModulationEnvelope">
          <article name="${item.name}" class="Component Module">
            <div class="title-bar"><button class="toggle-button">${item.name}</button></div>
            <div class="expander-content ModuleParameters" name="${item.name}" data-template="EnvelopeBase"></div>
          </article>
        </template>

        <template id="FrequencyEnvelope">
          <article name="${item.name}" class="Component Module">
            <div class="title-bar"><button class="toggle-button">${item.name}</button></div>
            <div class="expander-content ModuleParameters" name="${item.name}" data-template="EnvelopeBase"></div>
          </article>
        </template>

        <template id="FilterComponent">
          <article name="${item.name}" class="Component Module">
            <div class="title-bar"><button class="toggle-button">${item.name}</button></div>
            <div class="expander-content ModuleParameters">
              <div name="Q" data-template="Q" value="1"></div>
              <div name="detune" data-template="Cents" value="0"></div>
              <div name="frequency" data-template="Frequency" value="0"></div>
              <div name="gain" data-template="FilterGain" value="0"></div>
              <div name="rolloff" data-template="Rolloff" value="-12"></div>
              <div name="type" data-template="FilterType" value="lowpass"></div>
            </div>
          </article>
        </template>

        <span id="source-templates">
          <template id="OmniOscillator">
            <article name="${item.name}" class="Source Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button></div>
              <div class="expander-content ModuleParameters">
                <div name="detune" data-template="Cents" class="${item.class}" value="0"></div>
                <div name="frequency" data-template="Frequency" value="0"></div>
                <div name="partialCount" data-template="partialCount" value="1"></div>
                <div name="phase" data-template="Degrees" value="0"></div>
                <div name="type" data-template="OscillatorType" value="square"></div>
              </div>
            </article>
          </template>

        </span>

        <span id="instrument-templates">

          <template id="AMSynth">
            <article name="${item.name}" class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="detune" data-template="Cents" value="0"></div>
                <div name="portamento" data-template="Time" value="0"></div>
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="harmonicity" data-template="NormalRange" value="0"></div>
                <div name="envelope" data-template="AmplitudeEnvelope"></div>
                <div name="modulation" data-template="OmniOscillator"></div>
                <div name="modulationEnvelope" data-template="ModulationEnvelope"></div>
                <div name="oscillator" data-template="OmniOscillator"></div>
              </div>
            </article>
          </template>

          <template id="DuoSynth">
            <article name="${item.name}" class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="detune" data-template="Cents" value="0"></div>
                <div name="portamento" data-template="Time" value="0"></div>
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="harmonicity" data-template="NormalRange" value="0"></div>
                <div name="vibratoAmount" data-template="NormalRange" value="0"></div>
                <div name="vibratoRate" data-template="Frequency" value="0"></div>
                <div name="voice0" data-template="MonoSynth"></div>
                <div name="voice1" data-template="MonoSynth"></div>
              </div>
            </article>
          </template>

          <template id="FMSynth">
            <article name="${item.name}" class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="detune" data-template="Cents" value="0"></div>
                <div name="portamento" data-template="Time" value="0"></div>
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="harmonicity" data-template="NormalRange" value="0"></div>
                <div name="modulationIndex" data-template="NormalRange" value="0"></div>
                <div name="envelope" data-template="AmplitudeEnvelope"></div>
                <div name="modulation" data-template="OmniOscillator"></div>
                <div name="modulationEnvelope" data-template="ModulationEnvelope"></div>
                <div name="oscillator" data-template="OmniOscillator"></div>
              </div>
            </article>
          </template>

          <template id="MembraneSynth">
            <article name="${item.name}" class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="detune" data-template="Cents" value="0"></div>
                <div name="portamento" data-template="Time" value="0"></div>
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="pitchDecay" data-template="Time" value="0"></div>
                <div name="octaves" data-template="octaves" value="0"></div>
                <div name="envelope" data-template="AmplitudeEnvelope"></div>
                <div name="oscillator" data-template="OmniOscillator"></div>
              </div>
            </article>
          </template>

          <template id="MetalSynth">
            <article name="${item.name}" class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="detune" data-template="Cents" value="0"></div>
                <div name="portamento" data-template="Time" value="0"></div>
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="harmonicity" data-template="NormalRange" value="0"></div>
                <div name="modulationIndex" data-template="NormalRange" value="0"></div>
                <div name="octaves" data-template="octaves" value="0"></div>
                <div name="resonance" data-template="resonance" value="0"></div>
                <div name="envelope" data-template="AmplitudeEnvelope"></div>
              </div>
            </article>
          </template>

          <template id="MonoSynth">
            <article name="${item.name}" class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="detune" data-template="Cents" value="0"></div>
                <div name="portamento" data-template="Time" value="0"></div>
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="envelope" class="envelope" data-template="AmplitudeEnvelope"></div>
                <div name="filter" class="filter" data-template="FilterComponent"></div>
                <div name="filterEnvelope" class="filterEnvelope" data-template="FrequencyEnvelope"></div>
                <div name="oscillator" class="oscillator" data-template="OmniOscillator"></div>
              </div>
            </article>
          </template>

          <template id="NoiseSynth">
            <article name="${item.name}" class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="noise" data-template="NoiseType" value="0"></div>
                <div name="envelope" class="envelope" data-template="AmplitudeEnvelope"></div>
              </div>
            </article>
          </template>

          <template id="PluckSynth">
            <article name="${item.name}" class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="attackNoise" data-template="attackNoise" value="0"></div>
                <div name="resonance" data-template="octaves" value="0"></div>
                <div name="release" data-template="octaves" value="0"></div>
                <div name="dampening" data-template="Frequency" value="0"></div>
              </div>
            </article>
          </template>

          <template id="PolySynth">
            <article name="${item.name}" class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="maxPolyphony" data-template="maxPolyphony" value="0"></div>
              </div>
            </article>
          </template>

          <template id="Synth">
            <article name="${item.name}" class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="detune" data-template="Cents" value="0"></div>
                <div name="portamento" data-template="Time" value="0"></div>
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="envelope" class="envelope" data-template="AmplitudeEnvelope"></div>
                <div name="oscillator" class="oscillator" data-template="OmniOscillator"></div>
              </div>
            </article>
          </template>

        </span>

        <span id="effect-templates">

          <template id="AutoFilter">
            <article name="${item.name}" class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="type" data-template="OscillatorType" value="lowpass"></div>
                <div name="frequency" data-template="Time" value="0"></div>
                <div name="depth" data-template="NormalRange" value="0"></div>
                <div name="baseFrequency" data-template="Frequency" value="0"></div>
                <div name="octaves" data-template="NormalRange" value="0"></div>
                <div name="filter" data-template="FilterComponent"></div>
              </div>
            </article>
          </template>

          <template id="AutoPanner">
            <article name="${item.name}" class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="depth" data-template="NormalRange" value="0"></div>
                <div name="frequency" data-template="Time" value="0"></div>
                <div name="type" data-template="OscillatorType" value="0"></div>
                <div name="wet" data-template="NormalRange" value="0"></div>
              </div>
            </article>
          </template>

          <template id="AutoWah">
            <article name="${item.name}" class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="Q" data-template="Positive" value="0"></div>
                <div name="baseFrequency" data-template="Frequency" value="0"></div>
                <div name="gain" data-template="Decibels" value="0"></div>
                <div name="octaves" data-template="NormalRange" value="0"></div>
                <div name="sensitivity" data-template="Decibels" value="0"></div>
                <div name="follower" data-template="Time" value="0"></div>
                <div name="wet" data-template="NormalRange" value="0"></div>
              </div>
            </article>
          </template>

          <template id="Compressor">
            <article name="${item.name}" class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="threshold" data-template="Decibels" value="1"></div>
                <div name="knee" data-template="knee" value="0"></div>
                <div name="ratio" data-template="ratio" value="0"></div>
                <div name="attack" data-template="NormalRange" value="0"></div>
                <div name="release" data-template="NormalRange" value="0"></div>
              </div>
            </article>
          </template>

          <template id="Distortion">
            <article name="${item.name}" class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="distortion" data-template="NormalRange" value="1"></div>
                <div name="oversample" data-template="OversampleType" value="none"></div>
                <div name="wet" data-template="NormalRange" value="0"></div>
              </div>
            </article>
          </template>

          <template id="Filter">
            <article name="${item.name}" class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="Q" data-template="Q" value="1"></div>
                <div name="detune" data-template="FilterDetune" value="0"></div>
                <div name="frequency" data-template="Frequency" value="0"></div>
                <div name="gain" data-template="FilterGain" value="0"></div>
                <div name="rolloff" data-template="Rolloff" value="-12"></div>
                <div name="type" data-template="FilterType" value="lowpass"></div>
              </div>
            </article>
          </template>

          <template id="Freeverb">
            <article name="${item.name}" class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="roomSize" data-template="NormalRange" value="0"></div>
                <div name="wet" data-template="NormalRange" value="0"></div>
              </div>
            </article>
          </template>

          <template id="JCReverb">
            <article name="${item.name}" class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="roomSize" data-template="NormalRange" value="0"></div>
                <div name="wet" data-template="NormalRange" value="0"></div>
              </div>
            </article>
          </template>

          <template id="LFO">
            <article name="${item.name}" class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="type" data-template="OscillatorType" value="lowpass"></div>
                <div name="min" data-template="ModulationRange" value="0"></div>
                <div name="max" data-template="ModulationRange" value="0"></div>
                <div name="phase" data-template="Degrees" value="0"></div>
                <div name="frequency" data-template="Time" value="0"></div>
                <div name="amplitude" data-template="NormalRange" value="0"></div>
              </div>
            </article>
          </template>

          <template id="Phaser">
            <article name="${item.name}" class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="frequency" data-template="Time" value="0"></div>
                <div name="Q" data-template="Positive" value="0"></div>
                <div name="baseFrequency" data-template="Frequency" value="0"></div>
                <div name="octaves" data-template="NormalRange" value="0"></div>
                <div name="wet" data-template="NormalRange" value="0"></div>
              </div>
            </article>
          </template>

          <template id="PingPongDelay">
            <article name="${item.name}" class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="delayTime" data-template="Time" value="0"></div>
                <div name="feedback" data-template="NormalRange" value="0"></div>
                <div name="wet" data-template="NormalRange" value="0"></div>
              </div>
            </article>
          </template>

          <template id="Reverb">
            <article name="${item.name}" class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="decay" data-template="Time" value="0"></div>
                <div name="preDelay" data-template="Time" value="0"></div>
                <div name="wet" data-template="NormalRange" value="0"></div>
              </div>
            </article>
          </template>

          <template id="StereoWidener">
            <article name="${item.name}" class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="width" data-template="NormalRange" value="0"></div>
                <div name="wet" data-template="NormalRange" value="0"></div>
              </div>
            </article>
          </template>

        </span>

      </span>

      <span id="daw-templates">
        <template id="Track">

          <article id="${item.id}" class="Track">
            <div class="track-header">
              <div class="title-bar">
                <label for="arm-${item.name}" class="custom-radio">
                  <input id="arm-${item.name}" type="radio" class="arm-track" name="arm-track" value="${item.id}">
                  <span class="checkmark"></span>
                </label>
                <div class="track-name">${item.name}</div>
                <label for="${item.name}-enabled" class="custom-checkbox">
                  <input id="${item.name}-enabled" type="checkbox" name="enabled" checked>
                  <span class="checkmark"></span>
                </label>
              </div>
              <div name="TrackLane" data-template="TrackLane"></div>
            </div>
            <div class="track-details">
              <div class="TrackClipsScrollView">
                <div name="TrackClipsContainer" class="TrackClipsContainer">
                  <div class="TimeBar"></div>
                  <span class="TrackClips"></span>
                </div>
              </div>
              <div name="Devices" class="TrackDevices"></div>
            </div>
          </article>

        </template>

        <template id="TrackLane">
          <div class="TrackLane ModuleParameters">
            <div name="pan" data-template="TrackPan" value="0"></div>
            <div name="volume" data-template="TrackVolume" value="0"></div>
          </div>
        </template>

        <template id="Clip">
          <article id="${item.id}" class="Clip">
            <div class="title-bar"><button class="toggle-button">${item.name}</button></div>
            <div class="expander-content ClipNotesContainer">
              <div class="TimeBar"></div>
              <span class="ClipNotes"></span>
            </div>
          </article>
        </template>

        <template id="ClipNote">
          <article class="ClipNote">
            <div class="Row">
              <span class="time">t: ${item.time}</span>
            </div>
            <div class="VisualNoteRow Row" title="${item.velocity} ${item.duration}">
              <div class="VelocityBackground" title="${item.velocity}"></div>
              <div class="note">${item.note} ${item.duration}</div>
            </div>
          </article>
        </template>

        <template id="MixerChannel">
          <div class="MixerChannel">
            <label class="MixerChannelLabel" for="${item.id}-input">${item.name}</label>
            <input id="${item.id}-input" name="${item.name}" type="range" min="-60" max="0" step="0.1" value="${item.value}">
            <value for="${item.id}-input">${item.value}</value>
          </div>
        </template>


      </span>
    </span>

  <div id="app-content">
    
    <div id="project-header" class="margins button-bar">
      <button id="open-project-button" class="control image-button"><img src="img/upload-black.png"></button>
      <input id="project-name" class="control" type="text" value="My project">
      <button id="save-project-button" class="control image-button margin-right"><img src="img/download-black.png"></button>
    </div>
    <div id="save-bar" style="display: none">
      <input type="file" id="file-input"  />
    </div>
      
    <div id="app-buttons" class="button-bar">
      <input id="tempo" class="control" type="number" value="120">
      
      <button id="play" class="control image-button transport-button margin-left"><img src="img/play-black.png"></button>
      <button id="stop" class="control image-button transport-button"><img src="img/stop-black.png"></button>
      <button id="rec" class="control image-button transport-button toggle-button"><img src="img/rec-black.png"></button>
      
      <input id="position" class="control time margin-left" type="text" value="1:1:1" readonly>

      <input id="project-length" class="control time margin-left" type="text" value="8:0:0">
      <button class="control image-button toggle-button active"><img src="img/loop.png"></button>
      
      <button id="toggle-mixer" class="control image-button toggle-button"><img src="img/mixer.png"></button>
    </div>
    
    <div class="zoom-label">
      <label class="range-label small">Zoom
        <input id="zoom" type="range" min="1" max="200" value="100">
      </label>
    </div>

    <div id="tracks-table-container" class="table-container" >
      <table id="tracks-table">
        <thead>
          <tr class="header-row">
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
    </div>
  </div>
  
  <div id="PresetBrowser" class="PresetBrowser">
    <div id="presets-data" style="display: none"></div>
  </div>
    
  <div id="bottom-panel" class="tab-control">

  
    <div id="devices-panel" name="Devices" class="tab-panel">
      <div class="panel-header">Devices</div>
      <div class="panel-content devices"></div>
    </div>
    
    <div id="clip-editor-panel" name="Clip editor" class="tab-panel">
      <div class="panel-header">Clip editor</div>
      <div class="panel-content">
        
        <input type="range" id="pianoroll-scroll-x" oninput="pianorollScrollX()" value=0 min="0" max=1000>
        <div style="display: flex; flex-direction: row">
          <input type="range" id="pianoroll-scroll-y" oninput="pianorollScrollY()" value=30>
          <webaudio-pianoroll id="piano-roll" width="345" height="300" timebase=12></webaudio-pianoroll>
          <input type="range" id="pianoroll-zoom-y" oninput="pianorollZoomY()" value=64 min=1 max=640>
        </div>
        <input type="range" id="pianoroll-zoom-x" oninput="pianorollZoomX()" value=220 min=1 max=640> 
        
      </div>
    </div>
    
    <div id="mixer-panel" name="Mixer" class="tab-panel">
      <div class="panel-header">Mixer</div>
      <div class="panel-content">
      </div>
    </div>
  
   <div class="tab-strip">
      <button id="devices-tab-button" class="tab-button" onclick="clickTab(window.event.currentTarget)">Devices</button>
      <button id="clip-editor-tab-button" class="tab-button" onclick="clickTab(window.event.currentTarget)">Clip editor</button>
      <button id="mixer-tab-button" class="tab-button" onclick="clickTab(window.event.currentTarget)">Mixer</button>
    </div>
    
  </div>
  <script>
initialize();
  </script>

</body>

</html>
