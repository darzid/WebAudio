<!DOCTYPE html>
<html>

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DAWSome</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/input-range.css">
    <link rel="stylesheet" href="css/toggle-button.css">
    <link rel="stylesheet" href="css/classes.css">

    <script src="//unpkg.com/systemjs@0.19.47/dist/system.js"></script>
    <script src="http://unpkg.com/tone"></script>
    <script src="..\lib\template-expander\template-expander.js"></script>
    <script src=".\ui-components\toggle-button.js"></script>
    <script src=".\recorder.js" type="module"></script>
    <script src=".\preset-browser.js"></script>
    <script src=".\project.js"></script>
    <script src=".\bind.js"></script>
    <script src=".\transport.js"></script>
  </head>

  <body>
    <span id="templates">

      <!-- Auto-generated Value type templates -->
      <span id="datatype-templates">
        <template id="NormalRange">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="1" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="Positive">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="Infinity" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="AudioRange">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="-1" max="1" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="Decibels">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="-40" max="0" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="Cents">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="-1200" max="1200" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="Frequency">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="22050" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="Time">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="Infinity" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="TransportTime">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="Infinity" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="Ticks">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="Infinity" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="Degrees">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="360" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="Radians">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="6.28318530717959" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="Gain">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="1" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="Volume">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="-60" max="0" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="Pan">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="-1" max="1" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="ModulationRange">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="-1000" max="1000" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="TrackVolume">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" title="${item.name}" type="range" min="-60" max="0" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="TrackPan">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" title="${item.name}" type="range" min="-1" max="1" step="0.1" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>


        <template id="amplitude">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="1" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="octaves">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="8" step="1" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="outputRange">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="any" max="any" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="attack">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="2" step="0.001" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="decay">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="2" step="0.001" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="release">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="2" step="0.001" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="detune">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="-1200" max="1200" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="phase">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="360" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="partialCount">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="32" step="1" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="Q">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="-20" max="20" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="FilterDetune">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="-2400" max="2400" step="0.1" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="FilterGain">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="-60" max="60" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="knee">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="40" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="ratio">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="1" max="20" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="attackNoise">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0.1" max="20" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="maxPolyphony">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="1" max="20" step="1" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>


        <template id="MixerTrack">
          <div class="MixerChannel">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="-60" max="0" step="0.1" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </div>
        </template>

      </span>

      <!-- Option Value templates -->
      <span id="optionvalue-templates">
        <template id="OscillatorType">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <select name="${item.name}" value="${item.value}">
              <option>sine</option>
              <option>square</option>
              <option>triangle</option>
              <option>sawtooth</option>
              <option>pulse</option>
              <option>pwm</option>
              <option>fatsine</option>
              <option>fatsquare</option>
              <option>fattriangle</option>
              <option>fatsawtooth</option>
              <option>amsine</option>
              <option>amsquare</option>
              <option>amtriangle</option>
              <option>amsawtooth</option>
              <option>fmsine</option>
              <option>fmsquare</option>
              <option>fmtriangle</option>
              <option>fmsawtooth</option>
            </select>
          </article>
        </template>

        <template id="EnvelopeCurve">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <select name="${item.name}" value="${item.value}">
              <option>linear</option>
              <option>exponential</option>
              <option>sine</option>
              <option>cosine</option>
              <option>bounce</option>
              <option>ripple</option>
              <option>step</option>
            </select>
          </article>
        </template>

        <template id="Rolloff">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <select name="${item.name}" value="${item.value}">
              <option>-12</option>
              <option>-24</option>
              <option>-48</option>
              <option>-96</option>
            </select>
          </article>
        </template>

        <template id="FilterType">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <select name="${item.name}" value="${item.value}">
              <option>lowpass</option>
              <option>highpass</option>
              <option>bandpass</option>
              <option>lowshelf</option>
              <option>highshelf</option>
              <option>peaking</option>
              <option>notch</option>
              <option>allpass</option>
            </select>
          </article>
        </template>

        <template id="OversampleType">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <select name="${item.name}" value="${item.value}">
              <option>none</option>
              <option>2x</option>
              <option>4x</option>
            </select>
          </article>
        </template>

        <template id="NoiseType">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <select name="${item.name}" value="${item.value}">
              <option>pink</option>
              <option>white</option>
              <option>brown</option>
            </select>
          </article>
        </template>
      </span>

      <!-- Components -->
      <span id="component-templates">
        <template id="EnvelopeBase">
          <span>
            <div name="attack" data-template="attack" value="0.1"></div>
            <div name="attackCurve" data-template="EnvelopeCurve" value="exponential"></div>
            <div name="decay" data-template="decay" value="0.2"></div>
            <div name="decayCurve" data-template="EnvelopeCurve" value="exponential"></div>
            <div name="sustain" data-template="NormalRange" value="1.0"></div>
            <div name="release" data-template="release" value="0.8"></div>
            <div name="releaseCurve" data-template="EnvelopeCurve" value="exponential"></div>
          </span>
        </template>

        <template id="AmplitudeEnvelope">
          <article class="Component Module">
            <div class="title-bar"><button class="toggle-button">${item.name}</button></div>
            <div class="expander-content ModuleParameters" data-template="EnvelopeBase"></div>
          </article>
        </template>

        <template id="ModulationEnvelope">
          <article class="Component Module">
            <div class="title-bar"><button class="toggle-button">${item.name}</button></div>
            <div class="expander-content ModuleParameters" data-template="EnvelopeBase"></div>
          </article>
        </template>

        <template id="FrequencyEnvelope">
          <article class="Component Module">
            <div class="title-bar"><button class="toggle-button">${item.name}</button></div>
            <div class="expander-content ModuleParameters" data-template="EnvelopeBase"></div>
          </article>
        </template>

        <template id="FilterComponent">
          <article class="Component Module">
            <div class="title-bar"><button class="toggle-button">${item.name}</button></div>
            <div class="expander-content ModuleParameters">
              <div name="Q" data-template="Q" value="1"></div>
              <div name="detune" data-template="Cents" value="0"></div>
              <div name="frequency" data-template="Frequency" value="0"></div>
              <div name="gain" data-template="FilterGain" value="0"></div>
              <div name="rolloff" data-template="Rolloff" value="-12"></div>
              <div name="type" data-template="FilterType" value="lowpass"></div>
            </div>
          </article>
        </template>

        <!-- Sources -->
        <span id="source-templates">
          <template id="OmniOscillator">
            <article class="Source Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button></div>
              <div class="expander-content ModuleParameters">
                <div name="detune" data-template="Cents" class="${item.class}" value="0"></div>
                <div name="frequency" data-template="Frequency" value="0"></div>
                <div name="partialCount" data-template="partialCount" value="1"></div>
                <div name="phase" data-template="Degrees" value="0"></div>
                <div name="type" data-template="OscillatorType" value="square"></div>
                <!-- <div name="volume" data-template="Decibels" value="0"></div> -->
              </div>
            </article>
          </template>
        </span>

        <!-- Instruments -->
        <span id="instrument-templates">

          <template id="AMSynth">
            <article class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="detune" data-template="Cents" value="0"></div>
                <div name="portamento" data-template="Time" value="0"></div>
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="harmonicity" data-template="NormalRange" value="0"></div>
                <div name="envelope" data-template="AmplitudeEnvelope"></div>
                <div name="modulation" data-template="OmniOscillator"></div>
                <div name="modulationEnvelope" data-template="ModulationEnvelope"></div>
                <div name="oscillator" data-template="OmniOscillator"></div>
              </div>
            </article>
          </template>

          <template id="DuoSynth">
            <article class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="detune" data-template="Cents" value="0"></div>
                <div name="portamento" data-template="Time" value="0"></div>
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="harmonicity" data-template="NormalRange" value="0"></div>
                <div name="vibratoAmount" data-template="NormalRange" value="0"></div>
                <div name="vibratoRate" data-template="Frequency" value="0"></div>
                <div name="voice0" data-template="MonoSynth"></div>
                <div name="voice1" data-template="MonoSynth"></div>
              </div>
            </article>
          </template>

          <template id="FMSynth">
            <article class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="detune" data-template="Cents" value="0"></div>
                <div name="portamento" data-template="Time" value="0"></div>
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="harmonicity" data-template="NormalRange" value="0"></div>
                <div name="modulationIndex" data-template="NormalRange" value="0"></div>
                <div name="envelope" data-template="AmplitudeEnvelope"></div>
                <div name="modulation" data-template="OmniOscillator"></div>
                <div name="modulationEnvelope" data-template="ModulationEnvelope"></div>
                <div name="oscillator" data-template="OmniOscillator"></div>
              </div>
            </article>
          </template>

          <template id="MembraneSynth">
            <article class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="detune" data-template="Cents" value="0"></div>
                <div name="portamento" data-template="Time" value="0"></div>
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="pitchDecay" data-template="Time" value="0"></div>
                <div name="octaves" data-template="octaves" value="0"></div>
                <div name="envelope" data-template="AmplitudeEnvelope"></div>
                <div name="oscillator" data-template="OmniOscillator"></div>
              </div>
            </article>
          </template>

          <template id="MetalSynth">
            <article class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="detune" data-template="Cents" value="0"></div>
                <div name="portamento" data-template="Time" value="0"></div>
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="harmonicity" data-template="NormalRange" value="0"></div>
                <div name="modulationIndex" data-template="NormalRange" value="0"></div>
                <div name="octaves" data-template="octaves" value="0"></div>
                <div name="resonance" data-template="octaves" value="0"></div>
                <div name="envelope" data-template="AmplitudeEnvelope"></div>
              </div>
            </article>
          </template>

          <template id="MonoSynth">
            <article class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="detune" data-template="Cents" value="0"></div>
                <div name="portamento" data-template="Time" value="0"></div>
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="envelope" class="envelope" data-template="AmplitudeEnvelope"></div>
                <div name="filter" class="filter" data-template="FilterComponent"></div>
                <div name="filterEnvelope" class="filterEnvelope" data-template="FrequencyEnvelope"></div>
                <div name="oscillator" class="oscillator" data-template="OmniOscillator"></div>
              </div>
            </article>
          </template>

          <template id="NoiseSynth">
            <article class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="noise" data-template="NoiseType" value="0"></div>
                <div name="envelope" class="envelope" data-template="AmplitudeEnvelope"></div>
              </div>
            </article>
          </template>

          <template id="PluckSynth">
            <article class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="attackNoise" data-template="attackNoise" value="0"></div>
                <div name="resonance" data-template="octaves" value="0"></div>
                <div name="release" data-template="octaves" value="0"></div>
                <div name="dampening" data-template="Frequency" value="0"></div>
              </div>
            </article>
          </template>

          <template id="PolySynth">
            <article class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="maxPolyphony" data-template="maxPolyphony" value="0"></div>
              </div>
            </article>

                  <input type="checkbox" name="enabled" checked>
                  <span class="checkmark"></span>

    <div id="daw" style="opacity: 0.5">
      <div id="loading">Loading</div>
      <div class="transport-bar">
        <button id="rec-button">REC</button>
        <button id="play-button">PLAY</button>
        <button id="stop-button">STOP</button>
        <div id="position"></div>
      </div>
      <div id="tracks">
      </div>
      <div id="mixer">
      </div>
      <div id="PresetBrowser" class="PresetBrowser">
        <div id="presets-data" style="display: none"></div>
      </div>
    </div>
    <script src="config.js"></script>
    <script>
      function consoleLog(...message) {
        console.log(message);
      }

      function consoleError(...message) {
        console.error(message);
      }
      applyTemplates();

      let output = document.getElementById("output");
      let presetBrowser = new PresetBrowser();
      var presets;
      var session = null;
      let selectedTrackId = null;

      var isInitialized = false;
      document.addEventListener("mousemove", async () => {
        await initialize();
      });

      async function initialize() {
        if (isInitialized == true)
          return;
        console.log("Initializing");

        isInitialized = true;
        await Tone.start();

        console.log("Tone lookahead: " + Tone.context.lookAhead);
        Tone.context.lookAhead = 0.3;

        await presetBrowser.loadPresets();


        session = {
          project: null
        }
        await loadProject(session);
        Tone.getTransport().bpm.value = session.project.tempo;

        let tracksElement = document.getElementById("tracks");
        let mixerElement = document.getElementById("mixer");

        session.project.tracks.forEach(track => {
          let trackElement = document.createElement("div");
          trackElement.id = track.id;
          trackElement.setAttribute("name", track.name);
          trackElement.setAttribute("data-template", "Track");
          tracksElement.appendChild(trackElement);

          let trackFaderElement = document.createElement("div");
          trackFaderElement.id = `${track.id}-fader`;
          trackFaderElement.type = "range";
          trackFaderElement.setAttribute("name", track.name);
          trackFaderElement.setAttribute("value", track.channel.volume.value);
          trackFaderElement.setAttribute("data-template", "MixerTrack");
          mixerElement.appendChild(trackFaderElement);

          applyTemplates();

          trackElement = document.getElementById(track.id);
          bind(trackElement.querySelector(".track-header"), track.channel);

          trackFaderElement = document.getElementById(`${track.id}-fader`);

          let trackVolumeInputElement = trackElement.querySelector(".TrackChannel input[name='volume']");
          let trackVolumeValueElement = trackElement.querySelector(".TrackChannel value[for='volume']");
          let trackFaderInputElement = trackFaderElement.querySelector("input");
          let trackFaderValueElement = trackFaderElement.querySelector("value");
          trackVolumeInputElement.addEventListener("input", () => {
            if (parseFloat(trackFaderInputElement.value) != parseFloat(trackVolumeInputElement.value)) {
              trackFaderInputElement.value = trackVolumeInputElement.value;
              trackFaderValueElement.innerHTML = trackFaderInputElement.value;
            }
          })

          trackFaderInputElement.addEventListener("input", () => {
            if (parseFloat(trackVolumeInputElement.value) != parseFloat(trackFaderInputElement.value)) {
              trackVolumeInputElement.value = trackFaderInputElement.value;
              track.channel.volume.value = parseFloat(trackFaderInputElement.value);
              trackVolumeValueElement.innerHTML = trackFaderInputElement.value;
              trackFaderValueElement.innerHTML = trackFaderInputElement.value;
            }
          });
          
          var doubleTapTimer;
          trackFaderInputElement.addEventListener("pointerdown", () => {
            if (doubleTapTimer) {
              let trackEnabledElement = trackElement.querySelector(".track-header input[type='checkbox'][name='enabled']");
              trackEnabledElement.checked = !trackEnabledElement.checked;
              var evnt = trackEnabledElement["onchange"];
              if (evnt) {
                evnt.call(trackEnabledElement, new Event("change"));
                console.log("Fire checkbox changed")
              }
              track.channel.mute = !trackEnabledElement.checked;
              trackFaderInputElement.classList.toggle("disabled");
              return;
            }
            else {
              doubleTapTimer = setTimeout(() => {
                if (!doubleTapTimer)
                  return;
                //Logger.log(`Stop double tap timer for ${knobInput.name}`);
                clearTimeout(doubleTapTimer);
                doubleTapTimer = null;
              }, 500);
            }
          });

          trackElement.querySelector(".track-header input[type='checkbox'][name='enabled']").addEventListener("change", (e) => {
            if (e.target.checked)
              console.log("Activating track " + track.id);
            else
              console.log("Deactivating track " + track.id);
            track.channel.mute = !e.target.checked;
            trackFaderInputElement.classList.toggle("disabled");
          });

          let trackDevicesElement = trackElement.querySelector("div[name='Devices']");
          track.devices.forEach(device => {
            let newDeviceElement = document.createElement("div");
            newDeviceElement.id = `${track.id}-${device.name}`;
            newDeviceElement.setAttribute("name", device.name);
            newDeviceElement.setAttribute("data-template", device.name);
            trackDevicesElement.appendChild(newDeviceElement);

            applyTemplates();
            let deviceElement = document.getElementById(newDeviceElement.id);
            bind(deviceElement, device);
            deviceElement.querySelector(".browse-button").addEventListener("click", (e) => presetBrowser.show(device, deviceElement));
          });

          let trackDevices = track.devices.filter(device => device.name != "LFO");
          let instrumentTarget = track.effects.length > 0 ? track.effects[0] : track.channel;
          for (let instrumentIndex = 0; instrumentIndex < track.instruments.length; instrumentIndex++) {
            track.instruments[instrumentIndex].connect(instrumentTarget);
          }

          for (let effectIndex = 0; effectIndex < track.effects.length - 1; effectIndex++) {
            track.effects[effectIndex].connect(track.effects[effectIndex + 1]);
          }
          if (track.effects.length > 0) {
            track.effects[track.effects.length - 1].connect(track.channel);
          }

          let trackClipsElement = trackElement.querySelector("div[name='Clips']");
          track.clips.forEach(clip => {
            let newClipElement = document.createElement("div");
            newClipElement.id = `${track.id}-${clip.name}`;
            newClipElement.setAttribute("name", clip.name);
            newClipElement.setAttribute("title", clip.name);
            newClipElement.setAttribute("data-template", "Clip");
            if (clip.endTime) {
              let clipDuration = Tone.Time(Tone.Time(clip.endTime) - Tone.Time(clip.startTime));
              let bars = clipDuration.toBarsBeatsSixteenths().split(":")[0];
              newClipElement.style.width = `${bars}em`;
            }
            else {
              newClipElement.style.width = `stretch`;
            }
            
            trackClipsElement.appendChild(newClipElement);

            applyTemplates();
          });
        })

        initializeToggleButtons();

        let armTrackInputs = document.querySelectorAll("input[type='radio'][name='arm-track']");
        armTrackInputs[0].checked = true;
        selectedTrackId = session.project.tracks[0].id;
        armTrackInputs.forEach(armTrackInput =>
          armTrackInput.addEventListener("change", () => selectedTrackId = armTrackInput.value));

        document.addEventListener("PlayNoteRequestEvent", (e) => playNote(e));
        document.addEventListener("StopNoteRequestEvent", (e) => stopNote(e));

        initializeTransport();
        document.getElementById("daw").style.opacity = 1;
        document.getElementById("loading").style.display = "none";
        console.log("Initialized");
      }

      function playNote(eventInfo) {
        let track = session.project.tracks.find(track => track.id === selectedTrackId);
        if (track.instruments.length == 0) return;
        track.instruments.forEach(instrument => {
          if (instrument.name == "NoiseSynth")
            instrument.triggerAttack(Tone.now());
          else
            instrument.triggerAttack(eventInfo.detail.note, Tone.now())
        });
      }

      function stopNote(eventInfo) {
        let track = session.project.tracks.find(track => track.id === selectedTrackId);
        if (track.instruments.length == 0) return;
        track.instruments.forEach(instrument => instrument.triggerRelease(Tone.now()));
      }
    </script>
  </body>
