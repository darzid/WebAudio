<!DOCTYPE html>
<html>

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" ="width=device-width, initial-scale=1">
    <title>DAWSome</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/input-range.css">
    <link rel="stylesheet" href="css/toggle-button.css">
    <link rel="stylesheet" href="css/classes.css">
    <link rel="stylesheet" href="css/phone.css">
    <link rel="stylesheet" href="css/laptop.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    
    <!-- <script src="//unpkg.com/systemjs@0.19.47/dist/system.js"></script> -->
    <script src="https://unpkg.com/tone"></script>
    <script src="..\lib\template-expander\template-expander.js"></script>
    <script src="..\lib\web-audio\piano-roll.js"></script>
    <script src=".\ui-components\toggle-button.js"></script>
    <script src=".\recorder.js" type="module"></script>
    <script src=".\preset-browser.js"></script>
    <script src=".\project.js"></script>
    <script src=".\bind.js"></script>
    <script src=".\transport.js"></script>
    <script src=".\user-interface.js"></script>
  </head>

  <body>
    <span id="templates">

      <!-- Auto-generated Value type templates -->
      <span id="datatype-templates">
        <template id="NormalRange">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <input id="${item.id}" name="${item.name}" type="range" min="0" max="1" step="0.01" value="${item.value}">
            <value for="${item.id}">${item.value}</value>
          </article>
        </template>

        <template id="Positive">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <input id="${item.id}" name="${item.name}" type="range" min="0" max="Infinity" step="0.01" value="${item.value}">
            <value for="${item.id}">${item.value}</value>
          </article>
        </template>

        <template id="AudioRange">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <input id="${item.id}" name="${item.name}" type="range" min="-1" max="1" step="0.01" value="${item.value}">
            <value for="${item.id}">${item.value}</value>
          </article>
        </template>

        <template id="Decibels">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <input id="${item.id}" name="${item.name}" type="range" min="-40" max="0" step="0.01" value="${item.value}">
            <value for="${item.id}">${item.value}</value>
          </article>
        </template>

        <template id="Cents">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <input id="${item.id}" name="${item.name}" type="range" min="-1200" max="1200" step="0.01" value="${item.value}">
            <value for="${item.id}">${item.value}</value>
          </article>
        </template>

        <template id="Frequency">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <input id="${item.id}" name="${item.name}" type="range" min="0" max="22050" step="0.01" value="${item.value}">
            <value for="${item.id}">${item.value}</value>
          </article>
        </template>

        <template id="Time">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <input id="${item.id}" name="${item.name}" type="range" min="0" max="Infinity" step="0.01" value="${item.value}">
            <value for="${item.id}">${item.value}</value>
          </article>
        </template>

        <template id="TransportTime">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <input id="${item.id}" name="${item.name}" type="range" min="0" max="Infinity" step="0.01" value="${item.value}">
            <value for="${item.id}">${item.value}</value>
          </article>
        </template>

        <template id="Ticks">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <input id="${item.id}" name="${item.name}" type="range" min="0" max="Infinity" step="0.01" value="${item.value}">
            <value for="${item.id}">${item.value}</value>
          </article>
        </template>

        <template id="Degrees">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <input id="${item.id}" name="${item.name}" type="range" min="0" max="360" step="0.01" value="${item.value}">
            <value for="${item.id}">${item.value}</value>
          </article>
        </template>

        <template id="Radians">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <input id="${item.id}" name="${item.name}" type="range" min="0" max="6.28318530717959" step="0.01" value="${item.value}">
            <value for="${item.id}">${item.value}</value>
          </article>
        </template>

        <template id="Gain">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <input id="${item.id}" name="${item.name}" type="range" min="0" max="1" step="0.01" value="${item.value}">
            <value for="${item.id}">${item.value}</value>
          </article>
        </template>

        <template id="Volume">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <input id="${item.id}" name="${item.name}" type="range" min="-60" max="0" step="0.01" value="${item.value}">
            <value for="${item.id}">${item.value}</value>
          </article>
        </template>

        <template id="Pan">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <input id="${item.id}" name="${item.name}" type="range" min="-1" max="1" step="0.01" value="${item.value}">
            <value for="${item.id}">${item.value}</value>
          </article>
        </template>

        <template id="ModulationRange">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <input id="${item.id}" name="${item.name}" type="range" min="-1000" max="1000" step="0.01" value="${item.value}">
            <value for="${item.id}">${item.value}</value>
          </article>
        </template>

        <template id="TrackVolume">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <input id="${item.id}" name="${item.name}" title="${item.name}" type="range" min="-60" max="0" step="0.01" value="${item.value}">
            <value name="${item.name}" for="${item.id}">${item.value}</value>
          </article>
        </template>

        <template id="TrackPan">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <input id="${item.id}" name="${item.name}" title="${item.name}" type="range" min="-1" max="1" step="0.1" value="${item.value}">
            <value for="${item.id}">${item.value}</value>
          </article>
        </template>


        <template id="amplitude">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <input id="${item.id}" name="${item.name}" type="range" min="0" max="1" step="0.01" value="${item.value}">
            <value for="${item.id}">${item.value}</value>
          </article>
        </template>

        <template id="octaves">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <input id="${item.id}" name="${item.name}" type="range" min="0" max="8" step="1" value="${item.value}">
            <value for="${item.id}">${item.value}</value>
          </article>
        </template>

        <template id="outputRange">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <input id="${item.id}" name="${item.name}" type="range" min="any" max="any" step="0.01" value="${item.value}">
            <value for="${item.id}">${item.value}</value>
          </article>
        </template>

        <template id="attack">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <input id="${item.id}" name="${item.name}" type="range" min="0" max="2" step="0.001" value="${item.value}">
            <value for="${item.id}">${item.value}</value>
          </article>
        </template>

        <template id="decay">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <input id="${item.id}" name="${item.name}" type="range" min="0" max="2" step="0.001" value="${item.value}">
            <value for="${item.id}">${item.value}</value>
          </article>
        </template>

        <template id="release">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <input id="${item.id}" name="${item.name}" type="range" min="0" max="2" step="0.001" value="${item.value}">
            <value for="${item.id}">${item.value}</value>
          </article>
        </template>

        <template id="detune">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <input id="${item.id}" name="${item.name}" type="range" min="-1200" max="1200" step="0.01" value="${item.value}">
            <value for="${item.id}">${item.value}</value>
          </article>
        </template>

        <template id="phase">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <input id="${item.id}" name="${item.name}" type="range" min="0" max="360" step="0.01" value="${item.value}">
            <value for="${item.id}">${item.value}</value>
          </article>
        </template>

        <template id="partialCount">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <input id="${item.id}" name="${item.name}" type="range" min="0" max="32" step="1" value="${item.value}">
            <value for="${item.id}">${item.value}</value>
          </article>
        </template>

        <template id="Q">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <input id="${item.id}" name="${item.name}" type="range" min="-20" max="20" step="0.01" value="${item.value}">
            <value for="${item.id}">${item.value}</value>
          </article>
        </template>

        <template id="FilterDetune">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <input id="${item.id}" name="${item.name}" type="range" min="-2400" max="2400" step="0.1" value="${item.value}">
            <value for="${item.id}">${item.value}</value>
          </article>
        </template>

        <template id="FilterGain">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <input id="${item.id}" name="${item.name}" type="range" min="-60" max="60" step="0.01" value="${item.value}">
            <value for="${item.id}">${item.value}</value>
          </article>
        </template>

        <template id="knee">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <input id="${item.id}" name="${item.name}" type="range" min="0" max="40" step="0.01" value="${item.value}">
            <value for="${item.id}">${item.value}</value>
          </article>
        </template>

        <template id="ratio">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <input id="${item.id}" name="${item.name}" type="range" min="1" max="20" step="0.01" value="${item.value}">
            <value for="${item.id}">${item.value}</value>
          </article>
        </template>

        <template id="attackNoise">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <input id="${item.id}" name="${item.name}" type="range" min="0.1" max="20" step="0.01" value="${item.value}">
            <value for="${item.id}">${item.value}</value>
          </article>
        </template>

        <template id="maxPolyphony">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <input id="${item.id}" name="${item.name}" type="range" min="1" max="20" step="1" value="${item.value}">
            <value for="${item.id}">${item.value}</value>
          </article>
        </template>




      </span>

      <!-- Option Value templates -->
      <span id="optionvalue-templates">
        <template id="OscillatorType">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <select name="${item.name}" value="${item.value}">
              <option>sine</option>
              <option>square</option>
              <option>triangle</option>
              <option>sawtooth</option>
              <option>pulse</option>
              <option>pwm</option>
              <option>fatsine</option>
              <option>fatsquare</option>
              <option>fattriangle</option>
              <option>fatsawtooth</option>
              <option>amsine</option>
              <option>amsquare</option>
              <option>amtriangle</option>
              <option>amsawtooth</option>
              <option>fmsine</option>
              <option>fmsquare</option>
              <option>fmtriangle</option>
              <option>fmsawtooth</option>
            </select>
          </article>
        </template>

        <template id="EnvelopeCurve">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <select name="${item.name}" value="${item.value}">
              <option>linear</option>
              <option>exponential</option>
              <option>sine</option>
              <option>cosine</option>
              <option>bounce</option>
              <option>ripple</option>
              <option>step</option>
            </select>
          </article>
        </template>

        <template id="Rolloff">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <select name="${item.name}" value="${item.value}">
              <option>-12</option>
              <option>-24</option>
              <option>-48</option>
              <option>-96</option>
            </select>
          </article>
        </template>

        <template id="FilterType">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <select name="${item.name}" value="${item.value}">
              <option>lowpass</option>
              <option>highpass</option>
              <option>bandpass</option>
              <option>lowshelf</option>
              <option>highshelf</option>
              <option>peaking</option>
              <option>notch</option>
              <option>allpass</option>
            </select>
          </article>
        </template>

        <template id="OversampleType">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <select name="${item.name}" value="${item.value}">
              <option>none</option>
              <option>2x</option>
              <option>4x</option>
            </select>
          </article>
        </template>

        <template id="NoiseType">
          <article class="Parameter">
            <label for="${item.id}">${item.name}</label>
            <select name="${item.name}" value="${item.value}">
              <option>pink</option>
              <option>white</option>
              <option>brown</option>
            </select>
          </article>
        </template>
      </span>

      <!-- Components -->
      <span id="component-templates">
        <template id="EnvelopeBase">
          <span>
            <div name="attack" data-template="attack" value="0.1"></div>
            <div name="attackCurve" data-template="EnvelopeCurve" value="exponential"></div>
            <div name="decay" data-template="decay" value="0.2"></div>
            <div name="decayCurve" data-template="EnvelopeCurve" value="exponential"></div>
            <div name="sustain" data-template="NormalRange" value="1.0"></div>
            <div name="release" data-template="release" value="0.8"></div>
            <div name="releaseCurve" data-template="EnvelopeCurve" value="exponential"></div>
          </span>
        </template>

        <template id="AmplitudeEnvelope">
          <article class="Component Module">
            <div class="title-bar"><button class="toggle-button">${item.name}</button></div>
            <div class="expander-content ModuleParameters" data-template="EnvelopeBase"></div>
          </article>
        </template>

        <template id="ModulationEnvelope">
          <article class="Component Module">
            <div class="title-bar"><button class="toggle-button">${item.name}</button></div>
            <div class="expander-content ModuleParameters" data-template="EnvelopeBase"></div>
          </article>
        </template>

        <template id="FrequencyEnvelope">
          <article class="Component Module">
            <div class="title-bar"><button class="toggle-button">${item.name}</button></div>
            <div class="expander-content ModuleParameters" data-template="EnvelopeBase"></div>
          </article>
        </template>

        <template id="FilterComponent">
          <article class="Component Module">
            <div class="title-bar"><button class="toggle-button">${item.name}</button></div>
            <div class="expander-content ModuleParameters">
              <div name="Q" data-template="Q" value="1"></div>
              <div name="detune" data-template="Cents" value="0"></div>
              <div name="frequency" data-template="Frequency" value="0"></div>
              <div name="gain" data-template="FilterGain" value="0"></div>
              <div name="rolloff" data-template="Rolloff" value="-12"></div>
              <div name="type" data-template="FilterType" value="lowpass"></div>
            </div>
          </article>
        </template>

        <!-- Sources -->
        <span id="source-templates">
          <template id="OmniOscillator">
            <article class="Source Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button></div>
              <div class="expander-content ModuleParameters">
                <div name="detune" data-template="Cents" class="${item.class}" value="0"></div>
                <div name="frequency" data-template="Frequency" value="0"></div>
                <div name="partialCount" data-template="partialCount" value="1"></div>
                <div name="phase" data-template="Degrees" value="0"></div>
                <div name="type" data-template="OscillatorType" value="square"></div>
                <!-- <div name="volume" data-template="Decibels" value="0"></div> -->
              </div>
            </article>
          </template>
        </span>

        <!-- Instruments -->
        <span id="instrument-templates">

          <template id="AMSynth">
            <article class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="detune" data-template="Cents" value="0"></div>
                <div name="portamento" data-template="Time" value="0"></div>
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="harmonicity" data-template="NormalRange" value="0"></div>
                <div name="envelope" data-template="AmplitudeEnvelope"></div>
                <div name="modulation" data-template="OmniOscillator"></div>
                <div name="modulationEnvelope" data-template="ModulationEnvelope"></div>
                <div name="oscillator" data-template="OmniOscillator"></div>
              </div>
            </article>
          </template>

          <template id="DuoSynth">
            <article class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="detune" data-template="Cents" value="0"></div>
                <div name="portamento" data-template="Time" value="0"></div>
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="harmonicity" data-template="NormalRange" value="0"></div>
                <div name="vibratoAmount" data-template="NormalRange" value="0"></div>
                <div name="vibratoRate" data-template="Frequency" value="0"></div>
                <div name="voice0" data-template="MonoSynth"></div>
                <div name="voice1" data-template="MonoSynth"></div>
              </div>
            </article>
          </template>

          <template id="FMSynth">
            <article class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="detune" data-template="Cents" value="0"></div>
                <div name="portamento" data-template="Time" value="0"></div>
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="harmonicity" data-template="NormalRange" value="0"></div>
                <div name="modulationIndex" data-template="NormalRange" value="0"></div>
                <div name="envelope" data-template="AmplitudeEnvelope"></div>
                <div name="modulation" data-template="OmniOscillator"></div>
                <div name="modulationEnvelope" data-template="ModulationEnvelope"></div>
                <div name="oscillator" data-template="OmniOscillator"></div>
              </div>
            </article>
          </template>

          <template id="MembraneSynth">
            <article class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="detune" data-template="Cents" value="0"></div>
                <div name="portamento" data-template="Time" value="0"></div>
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="pitchDecay" data-template="Time" value="0"></div>
                <div name="octaves" data-template="octaves" value="0"></div>
                <div name="envelope" data-template="AmplitudeEnvelope"></div>
                <div name="oscillator" data-template="OmniOscillator"></div>
              </div>
            </article>
          </template>

          <template id="MetalSynth">
            <article class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="detune" data-template="Cents" value="0"></div>
                <div name="portamento" data-template="Time" value="0"></div>
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="harmonicity" data-template="NormalRange" value="0"></div>
                <div name="modulationIndex" data-template="NormalRange" value="0"></div>
                <div name="octaves" data-template="octaves" value="0"></div>
                <div name="resonance" data-template="octaves" value="0"></div>
                <div name="envelope" data-template="AmplitudeEnvelope"></div>
              </div>
            </article>
          </template>

          <template id="MonoSynth">
            <article class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="detune" data-template="Cents" value="0"></div>
                <div name="portamento" data-template="Time" value="0"></div>
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="envelope" class="envelope" data-template="AmplitudeEnvelope"></div>
                <div name="filter" class="filter" data-template="FilterComponent"></div>
                <div name="filterEnvelope" class="filterEnvelope" data-template="FrequencyEnvelope"></div>
                <div name="oscillator" class="oscillator" data-template="OmniOscillator"></div>
              </div>
            </article>
          </template>

          <template id="NoiseSynth">
            <article class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="noise" data-template="NoiseType" value="0"></div>
                <div name="envelope" class="envelope" data-template="AmplitudeEnvelope"></div>
              </div>
            </article>
          </template>

          <template id="PluckSynth">
            <article class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="attackNoise" data-template="attackNoise" value="0"></div>
                <div name="resonance" data-template="octaves" value="0"></div>
                <div name="release" data-template="octaves" value="0"></div>
                <div name="dampening" data-template="Frequency" value="0"></div>
              </div>
            </article>
          </template>

          <template id="PolySynth">
            <article class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="maxPolyphony" data-template="maxPolyphony" value="0"></div>
              </div>
            </article>
          </template>

          <template id="Synth">
            <article class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="detune" data-template="Cents" value="0"></div>
                <div name="portamento" data-template="Time" value="0"></div>
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="envelope" class="envelope" data-template="AmplitudeEnvelope"></div>
                <div name="oscillator" class="oscillator" data-template="OmniOscillator"></div>
              </div>
            </article>
          </template>

        </span>

        <!-- Effects -->
        <span id="effect-templates">

          <template id="AutoFilter">
            <article class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="type" data-template="OscillatorType" value="lowpass"></div>
                <div name="frequency" data-template="Time" value="0"></div>
                <div name="depth" data-template="NormalRange" value="0"></div>
                <div name="baseFrequency" data-template="Frequency" value="0"></div>
                <div name="octaves" data-template="NormalRange" value="0"></div>
                <div name="filter" data-template="FilterComponent"></div>
              </div>
            </article>
          </template>

          <template id="AutoPanner">
            <article class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="depth" data-template="NormalRange" value="0"></div>
                <div name="frequency" data-template="Time" value="0"></div>
                <div name="type" data-template="OscillatorType" value="0"></div>
                <div name="wet" data-template="NormalRange" value="0"></div>
              </div>
            </article>
          </template>

          <template id="AutoWah">
            <article class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="Q" data-template="Positive" value="0"></div>
                <div name="baseFrequency" data-template="Frequency" value="0"></div>
                <div name="gain" data-template="Decibels" value="0"></div>
                <div name="octaves" data-template="NormalRange" value="0"></div>
                <div name="sensitivity" data-template="Decibels" value="0"></div>
                <div name="follower" data-template="Time" value="0"></div>
                <div name="wet" data-template="NormalRange" value="0"></div>
              </div>
            </article>
          </template>

          <template id="Compressor">
            <article class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="threshold" data-template="Decibels" value="1"></div>
                <div name="knee" data-template="knee" value="0"></div>
                <div name="ratio" data-template="ratio" value="0"></div>
                <div name="attack" data-template="NormalRange" value="0"></div>
                <div name="release" data-template="NormalRange" value="0"></div>
              </div>
            </article>
          </template>

          <template id="Distortion">
            <article class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="distortion" data-template="NormalRange" value="1"></div>
                <div name="oversample" data-template="OversampleType" value="none"></div>
                <div name="wet" data-template="NormalRange" value="0"></div>
              </div>
            </article>
          </template>

          <template id="Filter">
            <article class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="Q" data-template="Q" value="1"></div>
                <div name="detune" data-template="FilterDetune" value="0"></div>
                <div name="frequency" data-template="Frequency" value="0"></div>
                <div name="gain" data-template="FilterGain" value="0"></div>
                <div name="rolloff" data-template="Rolloff" value="-12"></div>
                <div name="type" data-template="FilterType" value="lowpass"></div>
              </div>
            </article>
          </template>

          <template id="Freeverb">
            <article class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="roomSize" data-template="NormalRange" value="0"></div>
                <div name="wet" data-template="NormalRange" value="0"></div>
              </div>
            </article>
          </template>

          <template id="JCReverb">
            <article class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="roomSize" data-template="NormalRange" value="0"></div>
                <div name="wet" data-template="NormalRange" value="0"></div>
              </div>
            </article>
          </template>

          <template id="LFO">
            <article class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="type" data-template="OscillatorType" value="lowpass"></div>
                <div name="min" data-template="ModulationRange" value="0"></div>
                <div name="max" data-template="ModulationRange" value="0"></div>
                <div name="phase" data-template="Degrees" value="0"></div>
                <div name="frequency" data-template="Time" value="0"></div>
                <div name="amplitude" data-template="NormalRange" value="0"></div>
              </div>
            </article>
          </template>

          <template id="Phaser">
            <article class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="frequency" data-template="Time" value="0"></div>
                <div name="Q" data-template="Positive" value="0"></div>
                <div name="baseFrequency" data-template="Frequency" value="0"></div>
                <div name="octaves" data-template="NormalRange" value="0"></div>
                <div name="wet" data-template="NormalRange" value="0"></div>
              </div>
            </article>
          </template>

          <template id="PingPongDelay">
            <article class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="delayTime" data-template="Time" value="0"></div>
                <div name="feedback" data-template="NormalRange" value="0"></div>
                <div name="wet" data-template="NormalRange" value="0"></div>
              </div>
            </article>
          </template>

          <template id="Reverb">
            <article class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="decay" data-template="Time" value="0"></div>
                <div name="preDelay" data-template="Time" value="0"></div>
                <div name="wet" data-template="NormalRange" value="0"></div>
              </div>
            </article>
          </template>

          <template id="StereoWidener">
            <article class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="width" data-template="NormalRange" value="0"></div>
                <div name="wet" data-template="NormalRange" value="0"></div>
              </div>
            </article>
          </template>

        </span>

      </span>

      <span id="daw-templates">

        <template id="Track">
          <article id="${item.id}" class="Track">
            <div class="track-header">
              <div class="title-bar">
                <!-- <input type="radio" id="arm-${item.name}" class="arm-track" name="arm-track" value="${item.id}"> -->
                <label for="arm-${item.name}" class="custom-radio">
                  <input id="arm-${item.name}" type="radio" class="arm-track" name="arm-track" value="${item.id}">
                  <span class="checkmark"></span>
                </label>
                <div class="track-name">${item.name}</div>
                <label for="${item.name}-enabled" class="custom-checkbox">
                  <input id="${item.name}-enabled" type="checkbox" name="enabled" checked>
                  <span class="checkmark"></span>
                </label>
              </div>
              <div name="channel" data-template="TrackChannel"></div>
            </div>
            <div class="track-details">
              <div name="TrackClipsContainer" class="TrackClipsContainer">
                <div class="TimeBar"></div>
                <span class="TrackClips"></span>
              </div>
              <div name="Devices" class="TrackDevices"></div>
            </div>
          </article>
        </template>

        <template id="TrackChannel">
          <div class="TrackChannel ModuleParameters">
            <div name="pan" data-template="TrackPan" value="0"></div>
            <div name="volume" data-template="TrackVolume" value="0"></div>
          </div>
        </template>

        <template id="Clip">
          <article id="${item.id}" class="Clip">
            <div class="title-bar"><button class="toggle-button">${item.name}</button></div>
            <div class="expander-content ClipNotes">
            </div>
          </article>
        </template>

        <template id="ClipNote">
          <article class="ClipNote">
            <!--
            <div class="ClipNoteRow">
              <div class="ColumnLeft">
                <div class="Row">
                  <span class="time">t: ${item.time}</span>
                  <span class="note ColumnRight">n: ${item.note}</span>
                </div>
                 <div class="Row">
                  <span class="duration">d: ${item.duration}</span>
                  <span class="velocity ColumnRight">v: ${item.velocity}</span>
                </div>
              </div>
            </div>
            -->
            <div class="Row">
              <span class="time">t: ${item.time}</span>
            </div>
            <div class="VisualNoteRow Row" title="${item.velocity} ${item.duration}">
              <div class="VelocityBackground" title="${item.velocity}"></div>
              <div class="note">${item.note} ${item.duration}</div>
            </div>
          </article>
        </template>

        <template id="MixerChannel">
          <div class="MixerChannel">
            <label for="${item.id}-input">${item.name}</label>
            <input id="${item.id}-input" name="${item.name}" type="range" min="-60" max="0" step="0.1" value="${item.value}">
            <value for="${item.id}-input">${item.value}</value>
          </div>
        </template>
      </span>
    </span>

    <div id="daw" style="opacity: 0.5">
      <div id="loading">Loading</div>      
        <div class="transport-bar">
          <button id="rec-button">REC</button>
          <button id="play-button">PLAY</button>
          <button id="stop-button">STOP</button>
          <div id="position"></div>
          <input type="checkbox" id="toggle-mixer" checked >
        </div>
        <div id="tracks" style="flex-direction: column">
          <input type="checkbox" id="toggle-clips" checked>
          <input type="checkbox" id="toggle-devices" checked>
        </div>
      <div id="mixer" class="Mixer">
      </div>
      <div id="PresetBrowser" class="PresetBrowser">
        <div id="presets-data" style="display: none"></div>
      </div>
    </div>
  </body>

</html>
