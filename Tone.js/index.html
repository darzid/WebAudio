<!DOCTYPE html>
<html>

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tone.JS</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/input-range.css">
    <link rel="stylesheet" href="css/toggle-button.css">
    <link rel="stylesheet" href="css/classes.css">

    <script src="//unpkg.com/systemjs@0.19.47/dist/system.js"></script>
    <script src="http://unpkg.com/tone"></script>
    <script src="..\lib\template-expander\template-expander.js"></script>
    <script src=".\ui-components\toggle-button.js"></script>
  </head>

  <body>
    <span id="templates">

      <!-- Auto-generated Value type templates -->
      <span id="datatype-templates">
        <template id="NormalRange">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="1" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="Positive">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="Infinity" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="AudioRange">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="-1" max="1" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="Decibels">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="-100" max="0" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="Cents">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="-1200" max="1200" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="Frequency">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="22050" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="Time">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="Infinity" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="TransportTime">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="Infinity" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="Ticks">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="Infinity" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="Degrees">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="360" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="Radians">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="6.28318530717959" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="Gain">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="1" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="Volume">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="-60" max="0" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="Pan">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="-1" max="1" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="ModulationRange">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="-1000" max="1000" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="TrackVolume">
          <article class="Parameter">
            <input name="${item.name}" title="${item.name}" type="number" min="-60" max="0" step="0.01" value="${item.value}">
          </article>
        </template>

        <template id="TrackPan">
          <article class="Parameter">
            <input name="${item.name}" title="${item.name}" type="number" min="-1" max="1" step="0.1" value="${item.value}">
          </article>
        </template>


        <template id="amplitude">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="1" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="octaves">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="8" step="1" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="outputRange">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="any" max="any" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="attack">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="Infinity" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="decay">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="Infinity" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="release">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="Infinity" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="detune">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="-1200" max="1200" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="phase">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="360" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="partialCount">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="32" step="1" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="Q">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="Infinity" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="FilterGain">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="-Infinity" max="Infinity" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="knee">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="0" max="40" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>

        <template id="ratio">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <input name="${item.name}" type="range" min="1" max="20" step="0.01" value="${item.value}">
            <value for="${item.name}">${item.value}</value>
          </article>
        </template>
      </span>

      <!-- Option Value templates -->
      <span id="optionvalue-templates">
        <template id="OscillatorType">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <select name="${item.name}" value="${item.value}">
              <option>sine</option>
              <option>square</option>
              <option>triangle</option>
              <option>sawtooth</option>
              <option>pulse</option>
              <option>pwm</option>
              <option>fatsine</option>
              <option>fatsquare</option>
              <option>fattriangle</option>
              <option>fatsawtooth</option>
              <option>amsine</option>
              <option>amsquare</option>
              <option>amtriangle</option>
              <option>amsawtooth</option>
              <option>fmsine</option>
              <option>fmsquare</option>
              <option>fmtriangle</option>
              <option>fmsawtooth</option>
            </select>
          </article>
        </template>

        <template id="EnvelopeCurve">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <select name="${item.name}" value="${item.value}">
              <option>linear</option>
              <option>exponential</option>
              <option>sine</option>
              <option>cosine</option>
              <option>bounce</option>
              <option>ripple</option>
              <option>step</option>
            </select>
          </article>
        </template>

        <template id="Rolloff">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <select name="${item.name}" value="${item.value}">
              <option>-12</option>
              <option>-24</option>
              <option>-48</option>
              <option>-96</option>
            </select>
          </article>
        </template>

        <template id="FilterType">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <select name="${item.name}" value="${item.value}">
              <option>lowpass</option>
              <option>highpass</option>
              <option>bandpass</option>
              <option>lowshelf</option>
              <option>highshelf</option>
              <option>peaking</option>
              <option>notch</option>
              <option>allpass</option>
            </select>
          </article>
        </template>

        <template id="OversampleType">
          <article class="Parameter">
            <label for="${item.name}">${item.name}</label>
            <select name="${item.name}" value="${item.value}">
              <option>none</option>
              <option>2x</option>
              <option>4x</option>
            </select>
          </article>
        </template>
      </span>

      <!-- Components -->
      <span id="component-templates">
        <template id="EnvelopeBase">
          <span>
            <div name="attack" data-template="Time" value="0.1"></div>
            <div name="attackCurve" data-template="EnvelopeCurve" value="exponential"></div>
            <div name="decay" data-template="Time" value="0.2"></div>
            <div name="decayCurve" data-template="EnvelopeCurve" value="exponential"></div>
            <div name="sustain" data-template="NormalRange" value="1.0"></div>
            <div name="release" data-template="Time" value="0.8"></div>
            <div name="releaseCurve" data-template="EnvelopeCurve" value="exponential"></div>
          </span>
        </template>

        <template id="AmplitudeEnvelope">
          <article class="Component Module">
            <div class="title-bar"><button class="toggle-button">${item.name}</button></div>
            <div class="expander-content ModuleParameters" data-template="EnvelopeBase"></div>
          </article>
        </template>

        <template id="ModulationEnvelope">
          <article class="Component Module">
            <div class="title-bar"><button class="toggle-button">${item.name}</button></div>
            <div class="expander-content ModuleParameters" data-template="EnvelopeBase"></div>
          </article>
        </template>

        <template id="FrequencyEnvelope">
          <article class="Component Module">
            <div class="title-bar"><button class="toggle-button">${item.name}</button></div>
            <div class="expander-content ModuleParameters" data-template="EnvelopeBase"></div>
          </article>
        </template>

        <template id="Filter">
          <article class="Component Module">
            <div class="title-bar"><button class="toggle-button">${item.name}</button></div>
            <div class="expander-content ModuleParameters">
              <div name="Q" data-template="Q" value="1"></div>
              <div name="detune" data-template="Cents" value="0"></div>
              <div name="frequency" data-template="Frequency" value="0"></div>
              <div name="gain" data-template="FilterGain" value="0"></div>
              <div name="rolloff" data-template="Rolloff" value="-12"></div>
              <div name="type" data-template="FilterType" value="lowpass"></div>
            </div>
          </article>
        </template>

        <!-- Sources -->
        <span id="source-templates">
          <template id="OmniOscillator">
            <article class="Source Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button></div>
              <div class="expander-content ModuleParameters">
                <div name="detune" data-template="Cents" class="${item.class}" value="0"></div>
                <div name="frequency" data-template="Frequency" value="0"></div>
                <div name="partialCount" data-template="partialCount" value="1"></div>
                <div name="phase" data-template="Degrees" value="0"></div>
                <div name="type" data-template="OscillatorType" value="square"></div>
                <!-- <div name="volume" data-template="Decibels" value="0"></div> -->
              </div>
            </article>
          </template>
        </span>

        <!-- Instruments -->
        <span id="instrument-templates">
          <template id="Synth">
            <article class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="detune" data-template="Cents" value="0"></div>
                <div name="portamento" data-template="Time" value="0"></div>
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="envelope" class="envelope" data-template="AmplitudeEnvelope"></div>
                <div name="oscillator" class="oscillator" data-template="OmniOscillator"></div>
              </div>
            </article>
          </template>

          <template id="MonoSynth">
            <article class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="detune" data-template="Cents" value="0"></div>
                <div name="portamento" data-template="Time" value="0"></div>
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="envelope" class="envelope" data-template="AmplitudeEnvelope"></div>
                <div name="filter" class="filter" data-template="Filter"></div>
                <div name="filterEnvelope" class="filterEnvelope" data-template="FrequencyEnvelope"></div>
                <div name="oscillator" class="oscillator" data-template="OmniOscillator"></div>
              </div>
            </article>
          </template>

          <template id="FMSynth">
            <article class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="detune" data-template="Cents" value="0"></div>
                <div name="portamento" data-template="Time" value="0"></div>
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="harmonicity" data-template="NormalRange" value="0"></div>
                <div name="modulationIndex" data-template="NormalRange" value="0"></div>
                <div name="envelope" data-template="AmplitudeEnvelope"></div>
                <div name="modulation" data-template="OmniOscillator"></div>
                <div name="modulationEnvelope" data-template="ModulationEnvelope"></div>
                <div name="oscillator" data-template="OmniOscillator"></div>
              </div>
            </article>
          </template>

          <template id="DuoSynth">
            <article class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="detune" data-template="Cents" value="0"></div>
                <div name="portamento" data-template="Time" value="0"></div>
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="harmonicity" data-template="NormalRange" value="0"></div>
                <div name="vibratoAmount" data-template="NormalRange" value="0"></div>
                <div name="vibratoRate" data-template="Frequency" value="0"></div>
                <div name="voice0" data-template="MonoSynth"></div>
                <div name="voice1" data-template="MonoSynth"></div>
              </div>
            </article>
          </template>

          <template id="MembraneSynth">
            <article class="Instrument Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="detune" data-template="Cents" value="0"></div>
                <div name="portamento" data-template="Time" value="0"></div>
                <div name="volume" data-template="Decibels" value="0"></div>
                <div name="pitchDecay" data-template="Time" value="0"></div>
                <div name="octaves" data-template="octaves" value="0"></div>
                <div name="envelope" data-template="AmplitudeEnvelope"></div>
                <div name="oscillator" data-template="OmniOscillator"></div>
              </div>
            </article>
          </template>
        </span>

        <!-- Effects -->
        <span id="effect-templates">
          <template id="AutoFilter">
            <article class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="type" data-template="OscillatorType" value="lowpass"></div>
                <div name="frequency" data-template="Time" value="0"></div>
                <div name="depth" data-template="NormalRange" value="0"></div>
                <div name="baseFrequency" data-template="Frequency" value="0"></div>
                <div name="octaves" data-template="NormalRange" value="0"></div>
                <div name="filter" data-template="Filter"></div>
              </div>
            </article>
          </template>

          <template id="PingPongDelay">
            <article class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="delayTime" data-template="Time" value="0"></div>
                <div name="feedback" data-template="NormalRange" value="0"></div>
                <div name="wet" data-template="NormalRange" value="0"></div>
              </div>
            </article>
          </template>

          <template id="Reverb">
            <article class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="decay" data-template="Time" value="0"></div>
                <div name="preDelay" data-template="Time" value="0"></div>
                <div name="wet" data-template="NormalRange" value="0"></div>
              </div>
            </article>
          </template>

          <template id="Freeverb">
            <article class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="roomSize" data-template="NormalRange" value="0"></div>
                <div name="wet" data-template="NormalRange" value="0"></div>
              </div>
            </article>
          </template>

          <template id="JCReverb">
            <article class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="roomSize" data-template="NormalRange" value="0"></div>
                <div name="wet" data-template="NormalRange" value="0"></div>
              </div>
            </article>
          </template>

          <template id="Phaser">
            <article class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="frequency" data-template="Time" value="0"></div>
                <div name="Q" data-template="Positive" value="0"></div>
                <div name="baseFrequency" data-template="Frequency" value="0"></div>
                <div name="octaves" data-template="NormalRange" value="0"></div>
                <div name="wet" data-template="NormalRange" value="0"></div>
              </div>
            </article>
          </template>

          <template id="Compressor">
            <article class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="threshold" data-template="Decibels" value="1"></div>
                <div name="knee" data-template="knee" value="0"></div>
                <div name="ratio" data-template="ratio" value="0"></div>
                <div name="attack" data-template="NormalRange" value="0"></div>
                <div name="release" data-template="NormalRange" value="0"></div>
              </div>
            </article>
          </template>

          <template id="Distortion">
            <article class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="distortion" data-template="NormalRange" value="1"></div>
                <div name="oversample" data-template="OversampleType" value="none"></div>
                <div name="wet" data-template="NormalRange" value="0"></div>
              </div>
            </article>
          </template>

          <template id="LFO">
            <article class="Effect Module">
              <div class="title-bar"><button class="toggle-button">${item.name}</button><button class="browse-button"><img src="img/browse.png"></button><input type="checkbox" name="enabled" checked></div>
              <div class="expander-content ModuleParameters">
                <div name="type" data-template="OscillatorType" value="lowpass"></div>
                <div name="min" data-template="ModulationRange" value="0"></div>
                <div name="max" data-template="ModulationRange" value="0"></div>
                <div name="phase" data-template="Degrees" value="0"></div>
                <div name="frequency" data-template="Time" value="0"></div>
                <div name="amplitude" data-template="NormalRange" value="0"></div>
              </div>
            </article>
          </template>

        </span>

      </span>

      <span id="daw-templates">

        <template id="TrackChannel">
          <div class="TrackChannel ModuleParameters">
            <div name="pan" data-template="TrackPan"></div>
            <div name="volume" data-template="TrackVolume"></div>
          </div>
        </template>

        <template id="Track">
          <article id="${item.id}" class="Track">
            <div class="track-header">
              <div class="title-bar"><label class="arm-track" for="arm-${item.name}">ARM</label><input type="radio" id="arm-${item.name}" class="arm-track" name="arm-track" value="${item.id}"><button class="toggle-button">${item.name}</button><input type="checkbox" name="enabled" checked></div>
              <div name="channel" data-template="TrackChannel"></div>
            </div>
            <div name="Devices" class="TrackDevices"></div>
          </article>
        </template>

      </span>
    </span>

    <div id="loading">Loading</div>

    <div id="tracks" style="opacity: 0.5">
      <div class="transport-bar">
        <button id="play-button">PLAY</button>
        <button id="stop-button">STOP</button>
      </div>
    </div>

    <div id="PresetBrowser" class="PresetBrowser">
      <div id="presets-data" style="display: none"></div>
    </div>

    <script src="config.js"></script>
    <script>
      function consoleLog(...message) {
        console.log(message);
      }

      function consoleError(...message) {
        console.error(message);
      }
      applyTemplates();

      let output = document.getElementById("output");
      var presets;

      let project = {
        tracks: [],
        masterChannel: new Tone.Channel()
      };
      project.masterChannel.receive("master", 0);
      project.masterChannel.toDestination();

      let selectedTrackId = null;

      var isInitialized = false;
      document.addEventListener("click", async () => {
        await initialize();
      });
      // document.addEventListener("keydown", async () => {
      //   await initialize();
      // });

      async function initialize() {
        if (isInitialized == true)
          return;
        console.log("Initializing");

        isInitialized = true;
        await Tone.start();

        if (!presets) {
          loadPresets();
          console.log(`Loaded presets to presets-data`, document.getElementById("presets-data"));
        }
        else {
          console.warn("Already loaded presets");
        }

        project.tracks.push({
          id: "track1",
          name: "Track 1",
          devices: [
            new Tone.MembraneSynth({
              "detune": -1000,
              "pitchDecay": 0.05,
              "octaves": 8,
              "envelope": {
                "attack": 0.001,
                "decay": 100,
                "sustain": 1,
                "release": 40
              },
            }),
            new Tone.Distortion({
              "distortion": 0.1,
              "oversample": "none",
              "wet": 0.5
            }),
            new Tone.Compressor({
              "threshold": -12,
              "knee": 25,
              "ratio": 20,
              "attack": 0.6,
              "release:": 0.25
            }
            )
          ],
          sequence: new Tone.Sequence(playTrack1Note, ["C1"], "4n"),
        });

        project.tracks.push({
          id: "track2",
          name: "Track 2",
          devices: [
            new Tone.MonoSynth({
              "volume": 10,
              "oscillator": {
                "type": "sawtooth"
              },
              "filter": {
                "Q": 0.3,
                "detune": -1000,
                "frequency": 0,
                "gain": 0,
                "rolloff": -48,
                "type": "bandpass"
              },
              "envelope": {
                "attack": 0.01,
                "decay": 0.4,
                "sustain": 0,
                "release": 0
              },
              "filterEnvelope": {
                "attack": 3,
                "decay": 1.3,
                "sustain": 1,
                "release": 0.7,
                "releaseCurve": "linear",
                "baseFrequency": 20,
                "octaves": 5
              }
            }),
            new Tone.Compressor()
          ],
          sequence: new Tone.Sequence(playTrack2Note, ["", "G#1", "G#1", "G#1"], "4n")
        });

        project.tracks.push({
          id: "track3", name: "Track 3", devices: [
            new Tone.DuoSynth({
              "volume": -20}
            ),
            new Tone.AutoFilter(),
            new Tone.PingPongDelay(),
            new Tone.JCReverb()
          ]
        });

        project.tracks.push({
          id: "track4", name: "Track 4", devices: [
            new Tone.MonoSynth({
              "volume": -20,
              "filter": {
                "Q": 2.3,
                "rolloff": -48
              }
            }),
            new Tone.LFO({
              "type": "sawtooth",
              "frequency": 0.05,
              "min": -1000,
              "max": 400,
              "phase": 180,
              "amplitude": 1
            }),
            new Tone.JCReverb()
          ]
        });

        project.tracks.push({
          id: "track5", name: "Track 5", devices: [
            new Tone.FMSynth({
              "envelope": {
                "release": 0
              }
            }),
            new Tone.Phaser(),
            new Tone.PingPongDelay({
              "wet": 0
            }),
            new Tone.JCReverb({
              "wet": 0
            }
            )
          ]
        });

        let tracksElement = document.getElementById("tracks");

        project.tracks[0].loop = new Tone.Loop((time) => {
          project.tracks[0].devices[0].triggerAttackRelease("C2", "8n", time);
        }, "4n").start(0);

        project.tracks[1].loop = new Tone.Loop((time) => {
          project.tracks[1].devices[0].triggerAttackRelease("G1", "16n", time + Tone.Time("16n"));
          project.tracks[1].devices[0].triggerAttackRelease("G#1", "16n", time + Tone.Time("8n"));
          project.tracks[1].devices[0].triggerAttackRelease("G1", "16n", time + Tone.Time("16n") * 3);
        }, "4n").start(0);
        
        project.tracks[2].loop = new Tone.Loop((time) => {
          project.tracks[2].devices[0].triggerAttackRelease("G3", "16n", time + Tone.Time("16n"));
          project.tracks[2].devices[0].triggerAttackRelease("G#3", "16n", time + Tone.Time("8n"));
          project.tracks[2].devices[0].triggerAttackRelease("G2", "16n", time + Tone.Time("16n") * 3);
        }, "1n").start(0);

        project.tracks[3].loop = new Tone.Loop((time) => {
          project.tracks[3].devices[0].triggerAttackRelease("G1", "1n", time + Tone.Time("8n"));
        }, "1n").start(0);
        
        project.tracks[4].loop = new Tone.Loop((time) => {
          project.tracks[4].devices[0].triggerAttackRelease("G1", "1n", time + Tone.Time("8n"));
        }, "2n").start(0);

        project.tracks.forEach(track => {
          let trackElement = document.createElement("div");
          trackElement.id = track.id;
          trackElement.setAttribute("name", track.name);
          trackElement.setAttribute("data-template", "Track");
          tracksElement.appendChild(trackElement);

          track.channel = new Tone.Channel();
          track.channel.send("master", 0);

          applyTemplates();

          bind(document.getElementById(track.id).querySelector(".track-header"), track.channel);

          let trackDevicesElement = document.getElementById(track.id).querySelector("div[name='Devices']");

          track.devices.forEach(device => {
            let newDeviceElement = document.createElement("div");
            newDeviceElement.id = `${track.id}-${device.name}`;
            newDeviceElement.setAttribute("name", device.name);
            newDeviceElement.setAttribute("data-template", device.name);
            trackDevicesElement.appendChild(newDeviceElement);

            applyTemplates();
            let deviceElement = document.getElementById(newDeviceElement.id);
            bind(deviceElement, device);
            deviceElement.querySelector(".browse-button").addEventListener("click", (e) => showPresetBrowser(device, deviceElement));
            deviceElement.querySelector("input[name='enabled']").addEventListener("change", (e) => track.channel.mute != track.channel.mute);
          });

          let trackDevices = track.devices.filter(device => device.name != "LFO");
          for (let deviceIndex = 0; deviceIndex < trackDevices.length - 1; deviceIndex++) {
            trackDevices[deviceIndex].connect(trackDevices[deviceIndex + 1]);
          }
          track.devices[track.devices.length - 1].connect(track.channel);

          if (track.sequence) {
            // track.sequence.synth = track.devices[0];
            // track.sequence.part = new Tone.Part((time, value) => {
            //   track.sequence.synth?.triggerAttackRelease(value.note, value.duration, time, value.velocity / 127);
            // }, track.sequence.events);
          }
        })

        initializeToggleButtons();

        let armTrackInputs = document.querySelectorAll("input[type='radio'][name='arm-track']");
        armTrackInputs[0].checked = true;
        selectedTrackId = project.tracks[0].id;
        armTrackInputs.forEach(armTrackInput => {
          armTrackInput.addEventListener("change", () => selectedTrackId = armTrackInput.value);
        });

        document.addEventListener("PlayNoteRequestEvent", (e) => playNote(e));
        document.addEventListener("StopNoteRequestEvent", (e) => stopNote(e));

        document.getElementById("tracks").style.opacity = 1;

        Tone.getTransport().bpm.value = 130;
        project.tracks[3].devices[1].connect(project.tracks[3].devices[0].filter.detune);
        project.tracks[3].devices[1].start();

        document.getElementById("play-button").addEventListener("click", () => {
          /*project.tracks.forEach(track => {
            if (track.sequence && track.sequence.part) {
              track.sequence.part.start(0);
            }
          });*/
          Tone.getTransport().start();
        });
        document.getElementById("stop-button").addEventListener("click", () => {
          Tone.getTransport().stop();
        });

        document.getElementById("loading").style.display = "none";
        console.log("Initialized");
      }

      function playTrack1Note(time, note) {
        let track = project.tracks.find(track => track.id === "track1");
        if (track.devices.length == 0) return;
        track.devices[0].triggerAttackRelease(note, "8n", time);
      }

      function playTrack2Note(time, note) {
        let track = project.tracks.find(track => track.id === "track2");
        if (track.devices.length == 0) return;
        track.devices[0].triggerAttackRelease(note, "8n", time);
      }

      function loadPresets() {
        fetch('.\\preset-bank.json')
          .then(response => {
            if (!response.ok) {
              throw new Error(`HTTP error! Status: ${response.status}`);
            }
            return response.json();
          })
          .then(data => {
            presets = data;
            let presetBrowser = document.getElementById("PresetBrowser");
            document.getElementById('presets-data').textContent = JSON.stringify(data, null, 2);

            let presetPaths = Object.keys(data);
            presetPaths.forEach(presetPath => {
              presetPath = presetPath.replace("effect\\", "").replace("instrument\\", "").replace(".json", "");
              let deviceName = presetPath.split("\\")[0];

              let devicePresetSelect = document.getElementById(deviceName + "-presets");
              if (!devicePresetSelect) {
                devicePresetSelect = document.createElement("select");
                devicePresetSelect.id = `${deviceName}-presets`;
                devicePresetSelect.size = 5;
                devicePresetSelect.style.display = "none";
                presetBrowser.appendChild(devicePresetSelect);
              }

              let option = document.createElement("option");
              option.innerText = presetPath.split("\\")[1];
              devicePresetSelect.appendChild(option);
            })
          })
          .catch(error => {
            console.error('Error loading JSON:', error);
          });
      }

      function showPresetBrowser(device, deviceElement) {
        let deviceName = deviceElement.getAttribute("name");
        let presetListElement = document.getElementById(`${deviceName}-presets`);
        if (!presetListElement) {
          return;
        }
        let boundingRect = deviceElement.querySelector(".title-bar").getBoundingClientRect();
        presetListElement.style.position = "absolute";
        presetListElement.style.left = `${boundingRect.left}px`;
        presetListElement.style.top = `${boundingRect.top + boundingRect.height}px`;
        presetListElement.style.width = `${boundingRect.width}px`;
        presetListElement.style.display = "inline";
        presetListElement.addEventListener("change", () => applyPreset(device, deviceElement, presetListElement, presetListElement.value));
      }

      function applyPreset(device, deviceElement, presetListElement, presetName) {
        let presetPaths = Object.keys(presets);
        let presetPath = presetPaths.find(presetPath => presetPath.endsWith("\\" + presetName));
        let preset = presets[presetPath];

        let presetParameterNames = Object.keys(preset);
        let presetCursor = preset;
        let module = device;
        applyModuleParameters(presetCursor, module, presetParameterNames);

        let addEventHandler = false;

        let numberParameters = deviceElement.querySelectorAll(".Parameter input");
        numberParameters.forEach(element => {
          bindNumberInputElement(element, device, addEventHandler);
        });

        let optionParameters = deviceElement.querySelectorAll(".Parameter select");
        optionParameters.forEach(element => {
          bindOptionSelectElement(element, device, addEventHandler);
        });

        presetListElement.style.display = "none";
        console.log(`Preset ${presetName} applied`);
      }

      function applyModuleParameters(presetCursor, module, presetParameterNames) {
        presetParameterNames.forEach(paramName => {
          if (typeof presetCursor[paramName] === "object") {
            let moduleParamNames = Object.keys(presetCursor[paramName]);
            applyModuleParameters(presetCursor[paramName], module[paramName], moduleParamNames);
          }
          else {
            let paramType = typeof presetCursor[paramName];
            if (paramType === "number" || paramType === "string") {
              if (typeof module[paramName] != "object") {
                module[paramName] = presetCursor[paramName];
              } else {
                module[paramName].value = presetCursor[paramName];
              }
            }
          }
        });
      }

      function playNote(eventInfo) {
        let track = project.tracks.find(track => track.id === selectedTrackId);
        if (track.devices.length == 0) return;
        track.devices[0].triggerAttack(eventInfo.detail.note, Tone.now());
      }

      function stopNote(eventInfo) {
        let track = project.tracks.find(track => track.id === selectedTrackId);
        if (track.devices.length == 0) return;
        track.devices[0].triggerRelease(Tone.now());
      }

      function bind(element, object) {
        console.log(`Bind ${element.getAttribute("name")} to object ${object.name}`, element, object);
        let addEventHandler = true;

        let numberParameters = element.querySelectorAll(`:scope > .ModuleParameters > article.Parameter input`);
        numberParameters.forEach(element => {
          bindNumberInputElement(element, object, addEventHandler);
        });

        let optionParameters = element.querySelectorAll(`:scope > .ModuleParameters > article.Parameter select`);
        optionParameters.forEach(element => {
          bindOptionSelectElement(element, object, addEventHandler);
        });

        let partialCountParameters = element.querySelectorAll(":scope > .ModuleParameters > article.Parameter input[name='partialCount']");
        partialCountParameters.forEach(element => {
          let oscillatorTypeParameterSelectElement = element.parentElement.parentElement.querySelector(".Parameter select[name='type']");
          let oscillatorTypeOptionElements = oscillatorTypeParameterSelectElement.querySelectorAll("option");
          let currentPartialCountSuffix = element.value > 0 ? `${element.value}` : "";
          element.addEventListener("change", () => {
            let newPartialCountSuffix = element.value > 0 ? `${element.value}` : "";
            oscillatorTypeOptionElements.forEach(option => option.innerText = option.innerText.replace(currentPartialCountSuffix, "") + newPartialCountSuffix);
            currentPartialCountSuffix = newPartialCountSuffix;
          })
        });

        let childModules = element.querySelectorAll(`:scope > .ModuleParameters > article.Module`);
        childModules.forEach(childModuleElement => {
          bind(childModuleElement, object[childModuleElement.getAttribute("name")]);
        });

        console.log(`Bind finished ${element.getAttribute("name")} to object ${object.name}`, element, object);
      }

      function bindNumberInputElement(element, object, addEventHandler) {
        let namespace = getParameterNamespace(element);
        let parameterOwner = getParameterOwner(object, namespace);
        let parameterName = element.name;
        let isNumberProperty = (typeof parameterOwner[parameterName] === "number");
        let valueElement = element.parentElement.querySelector(`value[for="${element.name}"]`);

        console.log(`Connecting input event for parameter "${namespace}"`, parameterOwner, parameterOwner[parameterName]);

        element.value = isNumberProperty ? parameterOwner[parameterName] : parameterOwner[parameterName].value;
        if (valueElement)
          valueElement.innerHTML = element.value;

        if (addEventHandler) {
          element.addEventListener("input", () => {
            let oldValue = isNumberProperty ? parameterOwner[parameterName] : parameterOwner[parameterName].value;
            if (isNumberProperty)
              parameterOwner[parameterName] = element.value;
            else
              parameterOwner[parameterName].value = element.value;
            if (valueElement)
              valueElement.innerHTML = element.value;
            //console.log(`Updated "${namespace}" from ${oldValue} to ${element.value}`);
          })
        }
      }

      function bindOptionSelectElement(element, object, addEventHandler) {
        let namespace = getParameterNamespace(element);
        let parameterOwner = getParameterOwner(object, namespace);
        let parameterName = element.name;

        //console.log(`Connecting select event for parameter "${namespace}"`, parameterOwner, parameterOwner[parameterName]);

        element.value = parameterOwner[parameterName];

        if (addEventHandler) {
          element.addEventListener("input", () => {
            let oldValue = parameterOwner[parameterName];
            parameterOwner[parameterName] = element.value;
            //console.log(`Updated "${namespace}" from ${oldValue} to ${element.value}`);
          });
        }
      }

      function getParameterNamespace(element) {
        let parentName = "";
        let parentElement = element.parentElement;
        while (parentElement && !parentName) {
          if (parentElement.classList.contains("Component") || parentElement.classList.contains("Source")) {
            parentName = parentElement.getAttribute("name");
          }
          else {
            parentElement = parentElement.parentElement;
          }
        }

        let namespace = parentName ? `${parentName}.${element.name}` : element.name;

        return namespace;
      }

      function getParameterOwner(object, namespace) {
        let namespaceParts = namespace.split(".");
        let parameterOwner = object;
        for (let namespacePartIndex = 0; namespacePartIndex < namespaceParts.length - 1; namespacePartIndex++) {
          parameterOwner = parameterOwner[namespaceParts[namespacePartIndex]];
        }

        if (!parameterOwner) {
          if (namespaceParts.length == 2) {
            return object;
          }
          else
            throw "Parameter owner object not found for parameter " + namespaceParts[namespaceParts.length - 1];
        }

        return parameterOwner;
      }
    </script>
  </body>

</html>
