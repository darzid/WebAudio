<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <script src="./number-input.js"></script>
  <style>
  number-input {
    color: red;
    fill: green;
    background-color: yellow;
  }

    .blue-number-input {
      fill: blue;
    }
  </style>
</head>

<body>

  Element style based fill:<br>
  <number-input value="10"></number-input>
  <br>
  Specific fill:<br>
  <number-input value="10" fill="red"></number-input>
  <br>
  Class based fill:<br>
  <number-input value="10" class="blue-number-input"></number-input>
  <br>
  Float:<br>
  <number-input value="10" step="0.1" class="blue-number-input"></number-input>
  <br>
  <hr>
  Change max:<br>
  <number-input id="max-input" value="2"></number-input>
  <br>
  Change step:<br>
  <number-input id="step-input" value="0.1" step="0.01" min="0.01" max="1"></number-input>
  <br>
  <number-input id="input-with-max" value="1" step="0.1"></number-input>
  <br>
  
    <script>
    let maxInput = document.getElementById("max-input");
    let stepInput = document.getElementById("step-input");
    maxInput.onchange = (ev) => {
      //console.log("onchange", ev.currentTarget.value);
      document.getElementById("input-with-max").max = ev.currentTarget.value;
    }
    stepInput.onchange = (ev) => {
      //console.log("onchange", ev.currentTarget.value);
      document.getElementById("input-with-max").step = ev.currentTarget.value;
    }
  </script>
</body>

</html>
