<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <script src="./number-input.js"></script>
  <style>
  number-input {
    color: red;
    fill: green;
    background-color: yellow;
  }

    .blue-number-input {
      fill: blue;
    }
  </style>
</head>

<body>
  Element style based fill:<br>
  <number-input value="10"></number-input>
  <br>
  Specific fill:<br>
  <number-input value="10" fill="red"></number-input>
  <br>
  Class based fill:<br>
  <number-input value="10" class="blue-number-input"></number-input>
  <br>
</body>

</html>
