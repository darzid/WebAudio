<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <script src="./number-input.js"></script>
  <style>
  number-input {
    color: red;
    fill: green;
    background-color: yellow;
  }

    .blue-number-input {
      fill: blue;
    }
  </style>
</head>

<body>

  Element style based fill:<br>
  <number-input value="10"></number-input>
  <br>
  Specific fill:<br>
  <number-input value="10" fill="red"></number-input>
  <br>
  Class based fill:<br>
  <number-input value="10" class="blue-number-input"></number-input>
  <br>
  Change max:<br>
  <number-input id="max-input" value="100"></number-input>
  <number-input id="input-with-max" value="50"></number-input>
  <br>
  
    <script>
    let maxInput = document.getElementById("max-input");
    maxInput.oninput = (ev) => {
      //console.log("oninput", ev.currentTarget.value);
      //document.getElementById("input-with-max").max = ev.currentTarget.value;
    }
    maxInput.onchange = (ev) => {
      //console.log("onchange", ev.currentTarget.value);
      document.getElementById("input-with-max").max = ev.currentTarget.value;
    }
  </script>
</body>

</html>
