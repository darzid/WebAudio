    <div id="templates">
      <template data-types="Daw,channels,track1,track2" data-sortOrder="4">
        <article class="group">
          <button class="toggle-button dark-green">${propertyName}: ${propertyType}</button>
          <div class="content">${children}</div>
        </article>
      </template>

      <template data-types="Track" data-sortOrder="3">
        <article class="device" style="background: yellow">
          <button class="toggle-button dark-green">${namespace}: ${propertyType}</button>
          <div class="content">${children}</div>
        </article>
      </template>

      <template data-types="Channel,DuoSynth,FMSynth,MonoSynth,MembraneSynth,OmniOscillator,PingPongDelay" data-sortOrder="3">
        <article class="device">
          <button class="toggle-button dark-green">${namespace}: ${propertyType}</button>
          <div class="content">${children}</div>
        </article>
      </template>
      <template data-types="Filter,FrequencyEnvelope,AmplitudeEnvelope,Volume,Gain,Compressor" data-sortOrder="2">
        <article class="unit">
          <button class="toggle-button brown">${propertyName}: ${propertyType}</button>
          <div class="content">${children}</div>
        </article>
      </template>

      <template data-types="Signal,Param,Multiply,Scale,Frequency,Pow,OscillatorType,NormalRange,sustain,octaves,number" data-sortOrder="1">
        <article class="param ${propertyType}">
          <label for="${propertyName}"><b>${propertyName}</b>: <i>${propertyType}</i> <span class="small">[${minValue}..${maxValue}]</span> = <value for="${propertyName}">${value}</value> </label>
          <input class="propertyValue" type="range" name="${propertyName}" id="${namespace}" value="${value}" min="${minValue}" max="${maxValue}">
        </article>
      </template>

      <template data-types="string" data-sortOrder="1">
        <article class="param ${propertyType}">
          <label for="${propertyName}"><b>${propertyName}</b>: <i>${propertyType}</i> <span class="small">[${minValue}..${maxValue}]</span> = <value for="${propertyName}">${value}</value> </label>
          <input class="propertyValue" type="text" name="${propertyName}" id="${namespace}" value="${value}">
        </article>
      </template>

      function processDictionary(propertyName, objectType, currentObject, namespace) {
        let result = applyTemplate(objectType, propertyName, currentObject, namespace);
        if (result.templateHtml == "") {
          console.log(`No result HTML for object ${objectType}`, currentObject);
          return {
            templateHtml: null,
            templateSortOrder: null
          }
        }
        else {
          var templateResults = [];
          if (result.templateHtml && result.templateHtml.indexOf("${children}") > -1) {
            let childNames = Object.keys(currentObject);
            childNames.forEach(propertyName => {
              let objectProperty = currentObject[propertyName];
              let templateResult = processObject(propertyName, objectProperty, namespace + "." + propertyName);

              if (templateResult.templateHtml) {
                templateResults.push(templateResult);
              }
              else {
                let propDescriptor = getPropDescriptor(objectProperty, propertyName);
                if (propDescriptor) {
                  let enumProperty = objectProperty;
                  while (propDescriptor && propDescriptor.enumerable) {
                    console.log(`Applying template for property ${namespace}.${propertyName}: ${typeof enumProperty}`, enumProperty.length);
                    templateResult = processObjectProperty(propertyName, enumProperty, namespace + "." + propertyName);
                    if (templateResult.templateHtml) {
                      templateResults.push(templateResult);
                    }
                    propDescriptor = getPropDescriptor(enumProperty, propertyName);
                  }
                  if (propDescriptor.enumerable) {
                  }
                  else {
                    console.log(`Skipping property ${namespace}.${propertyName}: ${typeof objectProperty}, because it's not enumerable`);
                  }
                }
                // if (typeof objectProperty == "object") {
                // }
              }
            });

            let childrenHtml = "";

            const sortOrders = templateResults.filter((obj, index, self) =>
              index === self.findIndex((t) => t.templateSortOrder === obj.templateSortOrder)
            ).map(tr => tr.templateSortOrder).sort();

            sortOrders.forEach(sortOrder => {
              let groupedResults = templateResults.filter(tr => tr.templateSortOrder == sortOrder);
              groupedResults.forEach(result => childrenHtml += result.templateHtml);
            });
            result.templateHtml = result.templateHtml.replace("${children}", childrenHtml);
            console.log("parsed html", result, templateResults);
          }
        }
        return result;
      }

      function getPropDescriptor(currentObject, propertyName) {
        let propDescriptor = Object.getOwnPropertyDescriptor(currentObject, propertyName);
        let propObject = currentObject;
        while (!propDescriptor && propObject) {
          propObject = Object.getPrototypeOf(propObject);
          propDescriptor = Object.getOwnPropertyDescriptor(propObject, propertyName);
        }
        return propDescriptor;
      }
      function processObject(propertyName, currentObject, namespace) {
        let objectType = currentObject["name"];
        let propertyType = objectType ? objectType : typeof currentObject;
        let result = applyTemplate(propertyType, propertyName, currentObject, namespace);
        if (result.templateHtml == "")
          console.log(`No result HTML for object {propertyName}`, currentObject)

        var templateResults = [];
        if (result.templateHtml && result.templateHtml.indexOf("${children}") > -1) {
          let propNames = getObjectProperties(currentObject);
          console.log("processObject " + objectType, currentObject, propNames);

          propNames.forEach(propertyName => {
            let objectProperty = currentObject[propertyName];
            let templateResult = processObject(propertyName, objectProperty, namespace + "." + propertyName);

            if (templateResult.templateHtml) {
              templateResults.push(templateResult);
            }
            else {
              let propDescriptor = Object.getOwnPropertyDescriptor(currentObject, propertyName);
              let propObject = currentObject;
              while (!propDescriptor && propObject) {
                propObject = Object.getPrototypeOf(propObject);
                propDescriptor = Object.getOwnPropertyDescriptor(propObject, propertyName);
              }

              if (propDescriptor) {
                if (propDescriptor.enumerable) {
                  console.log(`Applying template for property ${namespace}.${propertyName}: ${typeof objectProperty}`, objectProperty.length);
                  templateResult = processObjectProperty(propertyName, objectProperty, namespace + "." + propertyName);
                  if (templateResult.templateHtml) {
                    templateResults.push(templateResult);
                  }
                }
                else {
                  console.log(`Skipping property ${namespace}.${propertyName}: ${typeof objectProperty}, because it's not enumerable`);
                }
              }
              // if (typeof objectProperty == "object") {
              // }
            }
          });

          let childrenHtml = "";

          const sortOrders = templateResults.filter((obj, index, self) =>
            index === self.findIndex((t) => t.templateSortOrder === obj.templateSortOrder)
          ).map(tr => tr.templateSortOrder).sort();

          sortOrders.forEach(sortOrder => {
            let groupedResults = templateResults.filter(tr => tr.templateSortOrder == sortOrder);
            groupedResults.forEach(result => childrenHtml += result.templateHtml);
          });
          result.templateHtml = result.templateHtml.replace("${children}", childrenHtml);
          console.log("parsed html", result, templateResults);
          return result;
        }
        else
          return {
            templateHtml: null,
            templateSortOrder: null
          }
      }

      function getObjectProperties(object) {
        let properties = Object.getOwnPropertyNames(object);//.filter(name => Object.getOwnPropertyDescriptor(object, name).writable);
        let baseObject = Object.getPrototypeOf(object);
        while (baseObject) {
          let baseProperties = Object.getOwnPropertyNames(baseObject)
          //.filter(name => Object.getOwnPropertyDescriptor(baseObject, name).writable);
          if (baseProperties.length > 0) {
            baseProperties.forEach(prop => {
              properties.push(prop);
              //console.log(Object.getOwnPropertyDescriptor(baseObject, prop));
            });
          }
          baseObject = Object.getPrototypeOf(baseObject);
        }
        properties = properties.filter(name => typeof object[name] != "function");
        console.log("base props", properties);

        let publicProperties = properties.filter(name => !name.startsWith("_"));

        let objectOrNumberProperties = publicProperties
          .filter(name => typeof object[name] == "object" || typeof object[name] == "number" || typeof object[name] == "string")
          .sort();

        if (publicProperties.length > objectOrNumberProperties.length) {
          let nonObjectProperties = publicProperties
            .filter(name => typeof object[name] != "object");
          //console.log("Non object public properties", nonObjectProperties)
        }

        return objectOrNumberProperties;
      }
      /*
      function getObjectProperties(object) {
        let publicProperties = Object.keys(object)
          .filter(name => !name.startsWith("_"))
        let objectProperties = publicProperties
          .filter(name => typeof object[name] == "object")
          .sort();
        
        if (publicProperties.length > objectProperties.length) {
          let nonObjectProperties = publicProperties
            .filter(name => typeof object[name] != "object");
          console.log("Non object public properties", nonObjectProperties)
        }
        return objectProperties;
      }
      */

      function processObjectProperty(propertyName, objectProperty, namespace) {
        //console.log("processObjectProperty", objectProperty);
        // if (objectProperty["name"]) {
        let propertyType = typeof objectProperty == "object" ? objectProperty["name"] : typeof objectProperty;
        if (!propertyType)
          propertyType = propertyName;

        let templateResult = applyTemplate(propertyType, propertyName, objectProperty, namespace);
        if (templateResult.templateHtml != "")
          return templateResult;
        else
          console.log(`No template found for Object property ${propertyName} with type ${propertyType}`, propertyName)
        // }
        // else
        //   console.log(`Object property ${propertyName} doesn't have a name property`, objectProperty);
        // return {
        //   templateHtml: null,
        //   templateSortOrder: null
        // }
      }

      const customRanges = {
        detune: {
          minValue: -1200,
          maxValue: 1200
        },
        volume: {
          minValue: -100,
          maxValue: 0
        },
        threshold: {
          minValue: -100,
          maxValue: 0
        },
        attack: {
          minValue: 0.001,
          maxValue: 1
        },
        release: {
          minValue: 0.001,
          maxValue: 1
        }
      }

      function applyTemplate(typeName, propertyName, objectProperty, namespace) {
        if (propertyName === "name") {
          return {
            templateHtml: null,
            templateSortOrder: null
          }
        }
        let template = document.querySelector(`template[data-types*="${typeName}"]`);
        if (template) {
          let metadataProperties = {
            propertyName: propertyName,
            propertyType: typeName,
            namespace: namespace,
            value: objectProperty
          }
          if (objectProperty.minValue) {
            metadataProperties["minValue"] = objectProperty.minValue;
          }
          if (objectProperty.maxValue) {
            metadataProperties["maxValue"] = objectProperty.maxValue;
          }
          if (objectProperty.minValue && objectProperty.maxValue) {
            if (objectProperty.maxValue == 1 && objectProperty.minValue == 0) {
              metadataProperties["step"] = 0.001;
            }
          }

          let templateHtml = template.innerHTML;
          let templateSortOrder = parseInt(template.dataset.sortorder);

          let matches = templateHtml.matchAll("[$]{(?<token>[a-zA-Z]+[0-9]?)}");
          matches.forEach(match => {
            let tokenName = match.groups["token"];
            let completeToken = match[0];
            /*  if (propertyName == "volume")
                console.log("Match:", tokenName, completeToken );*/
            if (tokenName != "children") {
              let tokenValue = "";
              if (customRanges[propertyName] && customRanges[propertyName][tokenName]) {
                let customRange = customRanges[propertyName][tokenName]
                //console.log(`Property ${propertyName}: updating token ${tokenName}=${tokenValue} with custom range ${customRange}`);
                tokenValue = customRanges[propertyName][tokenName]
              }
              else {
                tokenValue = (metadataProperties[tokenName]) ? metadataProperties[tokenName] : objectProperty[tokenName];
                if (tokenValue != undefined) {
                  if (tokenValue == "3.4028234663852886e+38")
                    tokenValue = "Infinity";
                  else if (tokenValue == "-3.4028234663852886e+38")
                    tokenValue = "-Infinity";
                }
              }

              if (tokenValue) {

                templateHtml = templateHtml.replace(completeToken, tokenValue);
                //console.log(`Replacing token "${completeToken}" with "${tokenValue}"`);
              }
              else {
                //  console.log(`Token "${completeToken}" has no value`);
              }
            }
          });
          return {
            templateHtml: templateHtml,
            templateSortOrder: templateSortOrder
          }
        }
        else {
          console.warn(`applyTemplate(): No template found for ${namespace}: ${typeName}`, objectProperty);

          return {
            templateHtml: null,
            templateSortOrder: null
          }
        }
      }

    </script>
