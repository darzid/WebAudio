 }
/* Collapsible Content (Collapsed State) */  
.content {  
  height: 0; /* Hide content initially */  
  overflow: hidden; /* Clip content when collapsed */  
  transition: opacity 0.2s;
  transition: height 0.2s;
  opacity: 0;  
  display: block;
}  

/* Expanded State */  
.content.expanded {  
  height: 100%;/* Larger than content's actual height */  
  opacity: 1; /* Fade in */  
  transition2: height 0.2s;
  transition2: opacity 2s;
}  

.device, 
.unit {
  border: 0.05rem solid rgba(50,50,50,0.8);
  border-radius: 0.2rem;
  background: rgba(0,0,0,0.2);
  margin: 0.1rem;
  padding: 0rem;
}

.device > button,
.unit > button {

  border-radius: 0.2rem;
  margin: 0.0rem;
}

.device > .content,
.unit > .content {

}

.content > .unit {

  margin-right: 0.5rem;
}

article {
  display: flex;
  flex-direction: column;
}

article.property {

}
label { display2: block; }

value { 
  vertical-align: bottom;
  font-size: 0.3rem;
}

input.propertyValue {
  text-align: right;
  margin-right: auto;
}


</style>

<div id="templates">
  
  <template data-types="DuoSynth,MonoSynth,OmniOscillator" data-sortOrder="3">
    <article class="device">
      <button class="toggle-button dark-green">${propertyName}: ${propertyType}</button>
      <div class="content">${children}</div>
    </article>
  </template>
  
  <template data-types="Filter,FrequencyEnvelope,AmplitudeEnvelope,Volume" data-sortOrder="2">
    <article class="unit">
      <button class="toggle-button brown">${propertyName}: ${propertyType}</button>
      <div class="content">${children}</div>
    </article>
  </template>
  
  
  <template data-types="Signal,Param,Multiply,Scale,Frequency,Pow,Gain" data-sortOrder="1">
    <article class="param ${propertyType}">
      <label for="${propertyName}">${propertyName}: ${propertyType} = <value for="${propertyName}">${value}</value></label>
      <input class="propertyValue" type="range" name="${propertyName}" value="${value}">
    </article>
  </template>
</div>

<div id="builder">
  
</div>
  <script>
  document.querySelector("#start-button")?.addEventListener("click", async () => {
    await Tone.start();
    console.log("audio is ready");
        
    let objects = {
      duoSynth: new Tone.DuoSynth()
    }
    console.log("DuoSynth is ready");
    const builder = document.querySelector("#builder");
    Object.keys(objects).forEach(objectKey => builder.innerHTML += processObject(objectKey, objects[objectKey]));
    
    const toggleBtns = document.querySelectorAll('.toggle-button');  
    alert("Found buttons " + toggleBtns.length)
    toggleBtns.forEach(button => {
      let content = button.parentElement.querySelector(".content");
      button.addEventListener('click', () => {  
        content.classList.toggle('expanded');  
      });  
    });
  });
  
  function processObject(propertyName, currentObject) {
    let objectType = currentObject["name"];
    let objectHtml = applyTemplate(objectType, propertyName, currentObject);
    //console.log("Object html", objectHtml)
    if (objectHtml && objectHtml.indexOf("${children}") > -1) {
      let childrenHtml = "";
      let propNames = getObjectProperties(currentObject);
      let childObjectsHtml = "";
      //console.log("processObject " + objectType, currentObject, propNames);
      propNames.forEach(propertyName => {
        let objectProperty = currentObject[propertyName];
        let childObjectHtml = processObject(propertyName, objectProperty);
        if (! childObjectHtml) {
          let propertyHtml = processObjectProperty(propertyName, objectProperty);
          if (propertyHtml) {
            childrenHtml += propertyHtml;
          }
        } else {
          childObjectsHtml += childObjectHtml;
        }
      });
      
      if (childObjectsHtml) {
          childrenHtml += childObjectsHtml;
        }
      //if (childrenHtml) {
        objectHtml = objectHtml.replace("${children}", childrenHtml);
        //console.log("Replaced ${children} with ", childrenHtml)
    //  } else {
        
    //  }
    }
    return objectHtml;
  }
  
  function getObjectProperties(object) {
    let publicProperties = Object.keys(object)
      .filter(name => !name.startsWith("_"))
    let objectProperties = publicProperties
      .filter(name => typeof object[name] == "object")
      .sort();
    
    if (publicProperties.length > objectProperties.length) {
      let nonObjectProperties = publicProperties
        .filter(name => typeof object[name] != "object");
      console.log("Non object public properties", nonObjectProperties)
    }
    return objectProperties;
  }
  
  function processObjectProperty(propertyName, objectProperty) {
    //console.log("processObjectProperty", objectProperty);
    if (objectProperty["name"]) {
      let propertyType = objectProperty["name"];
      let templateResult = applyTemplate(propertyType, propertyName, objectProperty);
      if (templateResult != "") 
        return templateResult;
      else 
        console.log("No template result for " + propertyType, propertyName)
    }
    else 
        console.log("No name for " + propertyName, objectProperty)
  }
  
  function applyTemplate(typeName, propertyName, objectProperty) {
    let template = document.querySelector(`template[data-types*="${typeName}"]`);
    if (template) {
      let metadataProperties = {
        propertyName: propertyName,
        propertyType: typeName
      }
      let templateHtml = template.innerHTML;
      
      let matches  = templateHtml.matchAll("[$]{(?<token>[a-zA-Z]+[0-9]?)}");
      matches.forEach(match => {
        let tokenName = match.groups["token"];
        let completeToken = match[0];
        //console.log("Match:", tokenName, completeToken );
        if (tokenName != "children")
        {
          let tokenValue = (metadataProperties[tokenName]) ? metadataProperties[tokenName] : objectProperty[tokenName];
          if (tokenValue != undefined) {
            templateHtml = templateHtml.replace(completeToken, tokenValue);
            //console.log(`Replacing token "${completeToken}" with "${tokenValue}"`);
          } 
          else {
          //  console.log(`Token "${completeToken}" has no value`);
          }
        }
      });
      return templateHtml;
    }
    else 
      console.log("No template for " + typeName);
  }

  
  


    
    </script>
