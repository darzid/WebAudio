<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web DAW - Ableton Live Edition</title>
    <!-- Tone.js CDN importeren voor audio-synthesis en timing -->
    <script src="https://unpkg.com/tone"></script>
    <style>
        /* Ableton Live Kleurenpalet & Typography */
        :root {
            --bg-dark: #1e1e1e;
            --panel-bg: #2c2c2c;
            --panel-border: #3f3f3f;
            --text-color: #b3b3b3;
            --text-light: #e6e6e6;
            --ableton-gold: #ffb700;
            --track-green: #00ffcc;
            --active-step: #ffea00;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-color);
            font-family: 'Consolas', 'Courier New', monospace;
            margin: 0;
            padding: 10px;
            user-select: none;
        }

        /* Welkomstscherm voor Autoplay Policy */
        #welcome-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(20, 20, 20, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #start-btn {
            background-color: var(--ableton-gold);
            color: black;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
            transition: transform 0.1s;
        }

        #start-btn:active {
            transform: scale(0.95);
        }

        /* Ableton Transport Bar */
        .transport-bar {
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 10px;
        }

        .play-btn {
            background-color: #383838;
            border: 1px solid var(--panel-border);
            color: var(--text-light);
            padding: 5px 15px;
            cursor: pointer;
            font-family: inherit;
        }

        .play-btn.playing {
            background-color: var(--track-green);
            color: black;
            font-weight: bold;
        }

        .bpm-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bpm-input {
            background-color: #151515;
            border: 1px solid var(--panel-border);
            color: var(--ableton-gold);
            width: 50px;
            padding: 3px;
            text-align: center;
            font-family: inherit;
        }

        .beat-counter {
            color: var(--track-green);
            font-size: 1.1rem;
        }

        /* DAW Main Layout (Tracks & Grid) */
        .workspace {
            display: flex;
            gap: 10px;
            height: 350px;
            margin-bottom: 10px;
        }

        .track-column {
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            width: 45%;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }

        .track-header {
            border-bottom: 2px solid var(--panel-border);
            padding-bottom: 5px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            color: var(--text-light);
        }

        /* Sequencer Grid */
        .step-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 5px;
            flex-grow: 1;
        }

        .step-button {
            background-color: #222;
            border: 1px solid #444;
            border-radius: 3px;
            cursor: pointer;
            transition: background-color 0.1s;
        }

        .step-button.active {
            background-color: var(--ableton-gold);
        }

        .step-button.playing-step {
            border: 1px solid white;
            box-shadow: 0 0 5px white;
        }

        /* Master Track & Visualizer */
        .master-column {
            background-color: #232323;
            border: 1px solid var(--panel-border);
            width: 10%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        #visualizer {
            background-color: #111;
            border: 1px solid var(--panel-border);
            width: 100%;
            height: 150px;
            margin-top: 15px;
        }

        /* Bottom Device Dock */
        .device-dock {
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 15px;
            display: flex;
            gap: 30px;
        }

        .device {
            background-color: #1f1f1f;
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            padding: 10px;
            min-width: 250px;
        }

        .device-title {
            color: var(--text-light);
            font-size: 0.8rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 3px;
        }

        .knob-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .knob-control {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
        }

        .knob-control input[type=range] {
            width: 120px;
            accent-color: var(--ableton-gold);
        }
    </style>
</head>
<body>

    <!-- Start Overlay (Autoplay compliant) -->
    <div id="welcome-overlay">
        <h1 style="color: var(--text-light); margin-bottom: 20px;">Ableton Live - Web Audio DAW</h1>
        <p style="color: var(--text-color); margin-bottom: 30px; text-align: center; max-width: 400px;">
            Klik op de knop om de Web Audio Context te starten en de DAW te activeren.
        </p>
        <button id="start-btn">Start DAW</button>
    </div>

    <!-- Transport Bar -->
    <div class="transport-bar">
        <button class="play-btn" id="play-pause-btn">▶ PLAY</button>
        <div class="bpm-container">
            <span>BPM:</span>
            <input type="number" class="bpm-input" id="bpm-input" value="120" min="40" max="240">
        </div>
        <div>
            <span>POSITION: </span>
            <span class="beat-counter" id="beat-counter">1 : 1 : 1</span>
        </div>
    </div>

    <!-- Grid / Workspace -->
    <div class="workspace">
        <!-- Track 1: Monophonic Synth -->
        <div class="track-column">
            <div class="track-header">
                <span>1. Melody Synth (Mono)</span>
                <span style="color: var(--ableton-gold);">MIDI</span>
            </div>
            <div class="step-grid" id="synth-grid">
                <!-- 16 stappen sequencer knoppen worden hier gegenereerd -->
            </div>
        </div>

        <!-- Track 2: Noise Beats -->
        <div class="track-column">
            <div class="track-header">
                <span>2. Rhythm Synth (Snare/Hat)</span>
                <span style="color: var(--ableton-gold);">MIDI</span>
            </div>
            <div class="step-grid" id="rhythm-grid">
                <!-- 16 stappen sequencer knoppen worden hier gegenereerd -->
            </div>
        </div>

        <!-- Master Spoor -->
        <div class="master-column">
            <div class="track-header" style="border: none;">
                <span>MASTER</span>
            </div>
            <div class="knob-control" style="flex-direction: column; gap: 10px; width: 100%;">
                <span style="font-size: 0.75rem;">VOL</span>
                <input type="range" id="master-vol" min="-40" max="0" value="-6" style="writing-mode: bt-lr; appearance: slider-vertical; height: 120px; accent-color: var(--track-green);">
            </div>
            <canvas id="visualizer"></canvas>
        </div>
    </div>

    <!-- Bottom FX / Instrument Devices -->
    <div class="device-dock">
        <!-- Filter Device -->
        <div class="device">
            <div class="device-title">Auto Filter</div>
            <div class="knob-row">
                <div class="knob-control">
                    <span>Frequency</span>
                    <input type="range" id="filter-freq" min="100" max="5000" value="1500">
                </div>
                <div class="knob-control">
                    <span>Resonance</span>
                    <input type="range" id="filter-res" min="1" max="15" value="1" step="0.5">
                </div>
            </div>
        </div>

        <!-- Feedback Delay Device -->
        <div class="device">
            <div class="device-title">Feedback Delay</div>
            <div class="knob-row">
                <div class="knob-control">
                    <span>Delay Time</span>
                    <input type="range" id="delay-time" min="0.05" max="1" value="0.25" step="0.05">
                </div>
                <div class="knob-control">
                    <span>Feedback</span>
                    <input type="range" id="delay-feedback" min="0" max="0.95" value="0.4" step="0.05">
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- AUDIO ENGINE SETUP ---
        
        // Geluidsbronnen en Routing initialiseren [7]
        const delay = new Tone.FeedbackDelay(0.25, 0.4).toDestination();
        const filter = new Tone.Filter(1500, "lowpass").connect(delay);
        
        // Track 1: Een standaard synthesizer met een ADSR-envelope [13, 14]
        const melodySynth = new Tone.Synth({
            oscillator: { type: "triangle" },
            envelope: { attack: 0.05, decay: 0.2, sustain: 0.3, release: 0.4 }
        }).connect(filter);

        // Track 2: Een synth specifiek ontworpen voor ritmische beats (korte decays) [15]
        const rhythmSynth = new Tone.Synth({
            oscillator: { type: "square" },
            envelope: { attack: 0.005, decay: 0.05, sustain: 0, release: 0.05 }
        }).connect(filter);

        // Analyseer-node voor de Master Visualizer [10]
        const analyser = new Tone.Analyser("waveform", 256);
        Tone.Destination.connect(analyser);

        // Sequencer patronen opslaan (16 stappen)
        const synthNotes = ["C4", "Eb4", "G4", "Bb4", "C5", "Eb5", "G5", "C4", "C4", "Eb4", "G4", "Bb4", "C5", "Eb5", "G5", "C5"];
        const synthSequence = Array(16).fill(false);
        const rhythmSequence = Array(16).fill(false);

        let currentStep = 0;

        // --- SCHEDULING EN TIMING ---

        // De centrale Transport scheduler instellen voor sample-nauwkeurige loop [5, 16]
        Tone.Transport.scheduleRepeat((time) => {
            const step = currentStep % 16;

            // Update de UI synchroon met de audioklok om haperingen te voorkomen [15]
            Tone.Draw.schedule(() => {
                updateSequencerVisuals(step);
            }, time);

            // Speel Melody Synth noot af als de stap actief is [17]
            if (synthSequence[step]) {
                melodySynth.triggerAttackRelease(synthNotes[step], "16n", time);
            }

            // Speel rhythm percussie-noot (korte percussieve "C2" bas) af [17]
            if (rhythmSequence[step]) {
                rhythmSynth.triggerAttackRelease("C2", "32n", time);
            }

            currentStep++;
        }, "16n"); // Herhaal elke 16e noot

        // --- DOM EN UI HANDLERS ---

        const welcomeOverlay = document.getElementById("welcome-overlay");
        const startBtn = document.getElementById("start-btn");
        const playPauseBtn = document.getElementById("play-pause-btn");
        const bpmInput = document.getElementById("bpm-input");
        const beatCounter = document.getElementById("beat-counter");

        // Autoplay compliance: Activeer Tone.js pas na klik [11, 12]
        startBtn.addEventListener("click", async () => {
            await Tone.start();
            welcomeOverlay.style.display = "none";
            
            // Zet initieel volume en start de visuele tekenlus
            Tone.Destination.volume.value = -6;
            drawVisualizer();
        });

        // Knoppen genereren voor de Sequencer Grid
        function generateGrid(containerId, sequenceArray) {
            const container = document.getElementById(containerId);
            for (let i = 0; i < 16; i++) {
                const btn = document.createElement("button");
                btn.className = "step-button";
                btn.dataset.index = i;
                btn.addEventListener("click", () => {
                    sequenceArray[i] = !sequenceArray[i];
                    btn.classList.toggle("active", sequenceArray[i]);
                });
                container.appendChild(btn);
            }
        }

        generateGrid("synth-grid", synthSequence);
        generateGrid("rhythm-grid", rhythmSequence);

        // Visualiseer de actuele afspeelstap over de sequencer
        function updateSequencerVisuals(step) {
            // Update maat en beat positie in Ableton-formaat (Maat : Kwart : Zestiende)
            const bar = Math.floor(step / 16) + 1;
            const beat = Math.floor((step % 16) / 4) + 1;
            const sixteenth = (step % 4) + 1;
            beatCounter.innerText = `${bar} : ${beat} : ${sixteenth}`;

            // Voeg class toe aan de spelende stap
            document.querySelectorAll(".step-grid").forEach(grid => {
                grid.childNodes.forEach((btn, index) => {
                    if (index === step) {
                        btn.classList.add("playing-step");
                    } else {
                        btn.classList.remove("playing-step");
                    }
                });
            });
        }

        // Play/Pause toggelen
        playPauseBtn.addEventListener("click", () => {
            if (Tone.Transport.state === "started") {
                Tone.Transport.stop();
                playPauseBtn.innerText = "▶ PLAY";
                playPauseBtn.classList.remove("playing");
                currentStep = 0;
                document.querySelectorAll(".step-button").forEach(btn => btn.classList.remove("playing-step"));
            } else {
                Tone.Transport.start();
                playPauseBtn.innerText = "■ STOP";
                playPauseBtn.classList.add("playing");
            }
        });

        // BPM Live aanpassen via de Transport [18]
        bpmInput.addEventListener("input", (e) => {
            const bpmValue = parseFloat(e.target.value);
            if (bpmValue >= 40 && bpmValue <= 240) {
                Tone.Transport.bpm.value = bpmValue;
            }
        });

        // --- DEVICE CONTROLS ---

        // Master Volume
        document.getElementById("master-vol").addEventListener("input", (e) => {
            Tone.Destination.volume.rampTo(parseFloat(e.target.value), 0.05); // Ramp voorkomt kliks [19]
        });

        // Auto Filter Controls
        document.getElementById("filter-freq").addEventListener("input", (e) => {
            filter.frequency.rampTo(parseFloat(e.target.value), 0.05);
        });
        document.getElementById("filter-res").addEventListener("input", (e) => {
            filter.Q.value = parseFloat(e.target.value);
        });

        // Delay Controls
        document.getElementById("delay-time").addEventListener("input", (e) => {
            delay.delayTime.rampTo(parseFloat(e.target.value), 0.1);
        });
        document.getElementById("delay-feedback").addEventListener("input", (e) => {
            delay.feedback.rampTo(parseFloat(e.target.value), 0.05);
        });

        // --- REAL-TIME VISUALIZER ---
        const canvas = document.getElementById("visualizer");
        const ctx = canvas.getContext("2d");

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);

            const buffer = analyser.getValue(); // Haal audio-rate golfvorm data op [20]
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.lineWidth = 2;
            ctx.strokeStyle = "#00ffcc"; // Ableton neon-groen
            ctx.beginPath();

            const sliceWidth = canvas.width / buffer.length;
            let x = 0;

            for (let i = 0; i < buffer.length; i++) {
                const v = buffer[i]; // Waarde tussen -1 en 1
                const y = (v + 1) * (canvas.height / 2);

                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }

                x += sliceWidth;
            }

            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();
        }
    </script>
</body>
</html>
